<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REO代購 預購系統</title>
  
  <!-- 1. 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; max-width: 650px; margin: auto; background-color: #121212; color: #e0e0e0; }
    .card { background: #1e1e1e; padding: 16px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.6); border: 1px solid #2c2c2c; }
    h2 { text-align: center; color: #ffffff; margin-bottom: 15px; letter-spacing: 0.5px; font-size: 20px; }
    
    .tab-buttons { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: 1px solid #444; background: #2a2a2a; color: #b0b0b0; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }

    /* ── 第一層：團務卡片清單 ── */
    .group-card {
      background: #252525;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .group-card:active { transform: scale(0.98); background: #2d2d2d; }
    .group-thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: #1a1a1a; flex-shrink: 0; border: 1px solid #374151; }
    .group-info { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
    .group-title { font-weight: bold; font-size: 15px; color: #f3f4f6; }
    
    .group-meta-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .badge-status { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
    .badge-deadline { background: rgba(248, 113, 113, 0.2); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.4); padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }

    .form-group { margin-bottom: 16px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; color: #d1d5db; font-size: 14px; }
    input[type="text"], input[type="email"], select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #374151; border-radius: 8px; font-size: 15px; background: #2b2b2b; color: #ffffff; }
    
    button { width: 100%; background-color: #3b82f6; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>REO代購 預購填單</h2>

    <div class="tab-buttons" style="display: flex; gap: 10px; margin-bottom: 15px;">
      <button id="btnPreorder" class="tab-btn active">填單預購</button>
      <button id="btnQuery" class="tab-btn">查詢紀錄</button>
      <button id="btnSurplus" class="tab-btn">餘量認領</button>
    </div>
    
    <!-- ════ 頁面一：團務卡片清單 ════ -->
    <div id="groupListSection">
      <label style="margin-bottom: 10px;">🔥 請選擇參與的預購團務：</label>
      <div id="groupCardsContainer">載入團務列表中...</div>
    </div>

    <!-- ════ 頁面二：商品選購與填單內頁 ════ -->
    <div id="orderFormSection" style="display: none;">
      <div class="inner-header">
        <button onclick="backToGroupList()">❮ 返回團務列表</button>
        <span class="active-group-title" id="activeGroupTitleText"></span>
      </div>
    </div>

    <!-- ════ 頁面三：查詢紀錄區塊 ════ -->
    <div id="querySection" style="display: none;">
      <div class="form-group">
        <label>查詢憑證 (手機號碼 或 Email)</label>
        <input type="text" id="searchKey" placeholder="輸入當時填寫的手機或信箱">
      </div>
      <button onclick="queryOrder()">查詢我的預購狀態</button>
      <div id="queryResult" style="margin-top: 15px;"></div>
    </div>
  </div>

  <script>
    // 2. 初始化 Supabase（已修正 URL 格式，移除了多餘的 /rest/v1/）
    const SUPABASE_URL = 'https://kpvlemwmgehusbievyqj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_793taIIHtCXRa3JtzkdcRg_Q18IjaWo';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 3. 當網頁載入完成時，開始載入團務列表
    window.addEventListener('DOMContentLoaded', () => {
      loadGroupList();
    });

    // 4. 抓取團務列表函式（對應 Supabase 的 groups 表格與中文欄位）
    async function loadGroupList() {
      var container = document.getElementById('groupCardsContainer');
      if (!container) {
        console.error("找不到 ID 為 'groupCardsContainer' 的元素！");
        return;
      }
      
      container.innerHTML = "載入團務列表中...";

      try {
        const { data: groups, error } = await supabase
          .from('groups')
          .select('*');

        if (error) throw error;

        console.log("Supabase 成功回傳資料：", groups);

        if (groups && groups.length > 0) {
          var html = "";
          groups.forEach(function(groupObj) {
            // 對應你的 Supabase 欄位名稱
            var gName = groupObj.團務名稱 || "未命名團務";
            var gImg = groupObj.圖片 || "";
            var gDeadline = groupObj.截單時間 || "未定";
            var isExpired = groupObj.isExpired || false;

            var statusBadge = isExpired ? 
              `<span class="badge-status" style="background:rgba(107,114,128,0.2); color:#9ca3af; border-color:rgba(107,114,128,0.4);">已結單</span>` : 
              `<span class="badge-status">開團中</span>`;
              
            var cardStyle = isExpired ? `opacity: 0.55; background: #1a1a1a;` : ``;

            html += `<div class="group-card" style="${cardStyle}" onclick="selectGroup('${gName}')">
                      ${gImg ? `<img src="${gImg}" class="group-thumb">` : `<div class="group-thumb" style="display:flex;align-items:center;justify-content:center;color:#3b82f6;font-size:20px;">🛒</div>`}
                      <div class="group-info">
                        <div class="group-title">${gName}</div>
                        <div class="group-meta-row">
                          ${statusBadge}
                          <span class="badge-deadline">截單：${gDeadline}</span>
                        </div>
                      </div>
                      <div style="color: #6b7280; font-weight: bold;">❯</div>
                    </div>`;
          });
          container.innerHTML = html;
        } else {
          container.innerHTML = `<p style="text-align:center; color:#9ca3af;">目前沒有進行中的團務。</p>`;
        }

      } catch (err) {
        console.error("Supabase 查詢失敗：", err);
        container.innerHTML = `<p style="text-align:center; color:#ef4444;">載入失敗: ${err.message}</p>`;
      }
    }

    function selectGroup(groupName) {
      console.log("選擇了團務：", groupName);
    }

    function backToGroupList() {
      document.getElementById('groupListSection').style.display = 'block';
      document.getElementById('orderFormSection').style.display = 'none';
    }
  </script>
</body>
</html>
