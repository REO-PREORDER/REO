<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REO代購 預購系統</title>
  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2, h3, h4 { text-align: center; color: #fff; margin-bottom: 15px; }
    
    /* 頂部切換按鈕列 */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .nav-tabs button { flex: 1; padding: 10px; background: #2b2b2b; color: white; border: none; border-radius: 8px; cursor: pointer; opacity: 0.5; font-weight: bold; transition: 0.2s; }
    .nav-tabs button.active { background: #1a73e8; opacity: 1; }

    /* 區塊通用樣式 */
    .section { display: none; }
    .section.active { display: block; }
    
    /* 卡片與表單欄位 */
    .card { background: #242424; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; }
    input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #121212; border: 1px solid #444; color: white; border-radius: 6px; font-size: 14px; }
    button.primary-btn { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    button.primary-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
    
    /* 購物車與狀態樣式 */
    .cart-box { background: #18181b; border: 1px solid #555; padding: 12px; border-radius: 8px; margin-top: 15px; display: none; }
    .status-pending { color: #f59e0b; font-weight: bold; }
    .status-confirmed { color: #10b981; font-weight: bold; }
    .status-cancelled { color: #ef4444; font-weight: bold; }

    /* 燈箱 Modal */
    #lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 999; }
    #lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h2>REO代購 預購系統</h2>

  <!-- 頂部頁籤按鈕 -->
  <div class="nav-tabs">
    <button id="btnPreorder" class="active" onclick="switchView('preorder')">填單預購</button>
    <button id="btnQuery" onclick="switchView('query')">查詢記錄</button>
    <button id="btnSurplus" onclick="switchView('surplus')">餘量認領</button>
  </div>

  <!-- 1. 填單預購區塊 -->
  <div id="preorderSection" class="section active">
    <div id="groupListView">
      <p style="color: #aaa; font-size: 13px; margin-bottom: 8px;">🔥 請選擇參與的預購團務：</p>
      <div id="groupCardsContainer">載入團務列表中...</div>
    </div>

    <!-- 商品與填單子畫面 -->
    <div id="productOrderView" style="display: none;">
      <button onclick="backToGroupList()" style="background: transparent; border: none; color: #1a73e8; cursor: pointer; margin-bottom: 10px;">← 返回選擇其他團務</button>
      <h3 id="activeGroupTitle" style="color: #10b981; text-align: left;"></h3>
      <div id="productCardsContainer"></div>

      <!-- 購物車摘要 -->
      <div id="cartSummaryBox" class="cart-box">
        <div style="font-weight: bold; margin-bottom: 6px; font-size: 13px; color: #f59e0b;">🛒 已選購明細 <span id="cartItemCount">(0件)</span></div>
        <div id="cartItemsList" style="margin-bottom: 8px;"></div>
        <div style="display: flex; justify-content: space-between; font-weight: bold; border-top: 1px solid #333; padding-top: 6px;">
          <span>總計金額：</span>
          <span id="cartTotalPrice" style="color: #f87171;">$0</span>
        </div>
      </div>

      <!-- 填寫資料表單 -->
      <div style="margin-top: 20px; background: #252525; padding: 15px; border-radius: 8px;">
        <h4 style="font-size: 13px; margin-bottom: 10px; color: #fff; text-align: left;">📝 填寫收件與聯絡資訊</h4>
        <input type="text" id="lineName" placeholder="Line / FB 暱稱 *">
        <input type="text" id="phone" placeholder="手機號碼 *">
        <input type="email" id="email" placeholder="Email (接收確認信) *">
        
        <label style="font-size: 12px; display: flex; align-items: center; gap: 6px; margin: 10px 0; cursor: pointer;">
          <input type="checkbox" id="agreeTerms" onchange="checkCanSubmit()"> 我已詳閱並同意代購規則與注意事項
        </label>
        
        <button id="submitBtn" class="primary-btn" onclick="submitOrder()" disabled>確認送出預購</button>
        <p id="statusMsg" style="text-align: center; margin-top: 10px; font-size: 12px;"></p>
      </div>
    </div>
  </div>

  <!-- 2. 查詢記錄區塊 -->
  <div id="querySection" class="section">
    <p style="color: #aaa; font-size: 13px; margin-bottom: 8px;">🔍 輸入手機號碼或 Email 查詢您的歷史預購：</p>
    <input type="text" id="searchKey" placeholder="請輸入手機或 Email">
    <button class="primary-btn" onclick="queryOrder()">開始查詢</button>
    <div id="queryResult" style="margin-top: 15px;"></div>
  </div>

  <!-- 3. 餘量認領區塊 -->
  <div id="surplusSection" class="section">
    <div id="surplusGroupList">載入中...</div>
    <div id="surplusProductList" style="margin-top: 15px;"></div>
  </div>

  <!-- 管理員後台登入入口 -->
  <div style="margin-top: 30px; border-top: 1px solid #333; padding-top: 15px; text-align: center;">
    <button onclick="toggleAdminLogin()" style="background: transparent; border: none; color: #777; font-size: 11px; cursor: pointer;">🔐 管理員後台登入</button>
    
    <div id="adminLoginForm" style="display: none; margin-top: 8px;">
      <input type="password" id="adminPassword" placeholder="請輸入管理員密碼" style="max-width: 200px; display: inline-block;">
      <button onclick="verifyAdmin()" style="padding: 10px 15px; background: #374151; color: white; border: none; border-radius: 6px; cursor: pointer;">登入</button>
    </div>

    <!-- 管理員後台控制面板（登入後顯示） -->
    <div id="adminDashboard" style="display: none; margin-top: 15px; text-align: left;">
      <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
      
      <h4 style="color: #10b981; margin-bottom: 10px; text-align: center;">📦 批次新增商品工具</h4>
      <div style="background: #252525; padding: 12px; border-radius: 8px; margin-bottom: 20px;">
        <label style="font-size: 12px; color: #ccc;">選擇要加入商品的團務：</label>
        <select id="adminTargetGroup" style="margin-top: 4px;"></select>
        
        <label style="font-size: 12px; color: #ccc;">貼上商品清單（格式：商品名稱, 價格，一行一個）：</label>
        <textarea id="batchProductsInput" rows="5" placeholder="例如：
周邊小卡A款, 150
壓克力立牌, 450
限定抱枕, 890" style="margin-top: 4px; font-family: monospace;"></textarea>
        
        <button class="primary-btn" onclick="submitBatchProducts()" style="background: #10b981;">一鍵批次新增商品</button>
        <p id="batchMsg" style="margin-top: 8px; font-size: 12px; text-align: center;"></p>
      </div>

      <h4 style="color: #fff; margin-bottom: 8px; text-align: center;">📋 待確認訂單管理</h4>
      <div id="pendingOrdersList">載入中...</div>
    </div>
  </div>
</div>

<!-- 燈箱圖片檢視 HTML -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="放大圖片">
</div>

<!-- JavaScript 邏輯區塊 -->
<script>
  // 初始化 Supabase 用戶端
  const SUPABASE_URL = 'https://kpvlemwmgehusbievyqj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_793taIIHtCXRa3JtzkdcRg_Q18IjaWo';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 全域變數
  let orderQuantities = {};
  let currentProducts = [];
  let selectedGroupName = "";
  let activeSurplusGroup = "";
  let currentSurplusProducts = [];

  // 頁面載入時執行
  window.addEventListener('DOMContentLoaded', () => {
    loadGroupList();
  });

  // 切換上方大頁籤
  function switchView(mode) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));

    if (mode === 'preorder') {
      document.getElementById('preorderSection').classList.add('active');
      document.getElementById('btnPreorder').classList.add('active');
    } else if (mode === 'query') {
      document.getElementById('querySection').classList.add('active');
      document.getElementById('btnQuery').classList.add('active');
    } else if (mode === 'surplus') {
      document.getElementById('surplusSection').classList.add('active');
      document.getElementById('btnSurplus').classList.add('active');
      loadSurplusGroups();
    }
  }

  // 1. 載入團務列表
  async function loadGroupList() {
    const container = document.getElementById('groupCardsContainer');
    if (!container) return;
    container.innerHTML = "載入團務列表中...";

    try {
      const { data: groups, error } = await db.from('groups').select('*');
      if (error) throw error;

      let adminGroupSelect = document.getElementById('adminTargetGroup');
      if (adminGroupSelect) adminGroupSelect.innerHTML = "";

      if (groups && groups.length > 0) {
        let html = "";
        let selectHtml = "";
        groups.forEach(g => {
          let gName = g["團務名稱"];
          let img = g["圖片"] || "";
          let deadline = g["截單時間"] || "未定";
          let isExpired = g["isExpired"] || false;
          let statusBadge = isExpired ? '<span style="color:#f87171;">已結單</span>' : '<span style="color:#4ade80;">開團中</span>';
          let cardStyle = isExpired ? 'opacity: 0.5; background: #181818;' : 'background: #242424;';

          html += `
            <div onclick="selectGroup('${gName}', ${isExpired})" class="card" style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; ${cardStyle}">
              <div style="display: flex; align-items: center; gap: 10px;">
                ${img ? `<img src="${img}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">` : '<div style="width:50px;height:50px;background:#333;border-radius:4px;display:flex;align-items:center;justify-content:center;">🛒</div>'}
                <div>
                  <div style="font-weight: bold; color: #fff; font-size: 14px;">${gName}</div>
                  <div style="font-size: 12px; margin-top: 4px;">${statusBadge} <span style="color: #aaa;">截單：${deadline}</span></div>
                </div>
              </div>
              <div style="color: #888;">➔</div>
            </div>
          `;
          selectHtml += `<option value="${gName}">${gName}</option>`;
        });
        container.innerHTML = html;
        if (adminGroupSelect) adminGroupSelect.innerHTML = selectHtml;
      } else {
        container.innerHTML = "<p style='text-align:center; color:#aaa;'>目前沒有進行中的團務。</p>";
        if (adminGroupSelect) adminGroupSelect.innerHTML = "<option value=''>目前無團務可選</option>";
      }
    } catch (err) {
      console.error(err);
      container.innerHTML = "<p style='color:#f87171; text-align:center;'>載入團務失敗。</p>";
    }
  }

  async function selectGroup(groupName, isExpired) {
    if (isExpired) {
      alert("此團務已結單，無法再進行預購！");
      return;
    }
    selectedGroupName = groupName;
    document.getElementById('groupListView').style.display = 'none';
    document.getElementById('productOrderView').style.display = 'block';
    document.getElementById('activeGroupTitle').innerText = "📂 " + groupName;

    const container = document.getElementById('productCardsContainer');
    container.innerHTML = "載入商品中...";
    orderQuantities = {};

    try {
      const { data: products, error } = await db
        .from('products')
        .select('*')
        .eq('團務名稱', groupName);

      if (error) throw error;
      currentProducts = products || [];

      if (currentProducts.length > 0) {
        let html = "";
        currentProducts.forEach((p, index) => {
          let pName = p["商品名稱"];
          let price = p["價格"];
          let img = p["圖片"] || "";
          
          html += `
            <div class="card" style="display: flex; gap: 10px; align-items: center;">
              ${img ? `<img src="${img}" onclick="openLightbox('${img}')" style="width: 60px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer;">` : ''}
              <div style="flex: 1;">
                <div style="font-weight: bold; font-size: 13px; color: #fff;">${pName}</div>
                <div style="color: #10b981; font-size: 12px; margin-top: 2px;">$${price}</div>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <button onclick="changeQty(${index}, -1)" style="width: 28px; height: 28px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;">-</button>
                <span id="qty_val_${index}" style="font-weight: bold; font-size: 13px; min-width: 20px; text-align: center;">0</span>
                <button onclick="changeQty(${index}, 1)" style="width: 28px; height: 28px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;">+</button>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = "<p style='color:#aaa; text-align:center;'>此團務目前沒有上架商品。</p>";
      }
    } catch (err) {
      console.error(err);
      container.innerHTML = "<p style='color:#f87171; text-align:center;'>載入商品失敗。</p>";
    }
    updateCartSummary();
    checkCanSubmit();
  }

  function backToGroupList() {
    document.getElementById('productOrderView').style.display = 'none';
    document.getElementById('groupListView').style.display = 'block';
    selectedGroupName = "";
  }

  function openLightbox(url) {
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox').style.display = 'flex';
  }
  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
  }

  function changeQty(index, delta) {
    if (!orderQuantities[index]) orderQuantities[index] = 0;
    orderQuantities[index] += delta;
    if (orderQuantities[index] < 0) orderQuantities[index] = 0;

    let displayElem = document.getElementById('qty_val_' + index);
    if (displayElem) displayElem.innerText = orderQuantities[index];

    updateCartSummary();
    checkCanSubmit();
  }

  function updateCartSummary() {
    let cartBox = document.getElementById('cartSummaryBox');
    let cartItemsList = document.getElementById('cartItemsList');
    let cartItemCount = document.getElementById('cartItemCount');
    let cartTotalPrice = document.getElementById('cartTotalPrice');
    if (!cartBox) return;

    let html = "";
    let totalCount = 0;
    let totalPrice = 0;

    currentProducts.forEach((p, index) => {
      let qty = orderQuantities[index] || 0;
      if (qty > 0) {
        totalCount += qty;
        let subtotal = qty * p["價格"];
        totalPrice += subtotal;
        html += `<div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px;">
                  <span>#${index+1} ${p["商品名稱"]} x ${qty}</span>
                  <span style="color: #f87171; font-weight: bold;">$${subtotal}</span>
                 </div>`;
      }
    });

    if (totalCount > 0) {
      cartBox.style.display = 'block';
      cartItemsList.innerHTML = html;
      cartItemCount.innerText = `(${totalCount}件)`;
      cartTotalPrice.innerText = `$${totalPrice}`;
    } else {
      cartBox.style.display = 'none';
    }
  }

  function checkCanSubmit() {
    let agree = document.getElementById('agreeTerms').checked;
    let submitBtn = document.getElementById('submitBtn');
    let hasSelected = Object.values(orderQuantities).some(q => q > 0);
    if (submitBtn) {
      submitBtn.disabled = !(selectedGroupName && agree && hasSelected);
    }
  }

  async function submitOrder() {
    let lineName = document.getElementById('lineName').value.trim();
    let phone = document.getElementById('phone').value.trim();
    let email = document.getElementById('email').value.trim();
    let statusMsg = document.getElementById('statusMsg');

    if (!lineName || !phone || !email) {
      alert("請完整填寫暱稱、手機與 Email！");
      return;
    }

    let selectedItems = [];
    let totalPrice = 0;
    currentProducts.forEach((p, index) => {
      let qty = orderQuantities[index] || 0;
      if (qty > 0) {
        selectedItems.push({ name: p["商品名稱"], price: p["價格"], qty: qty });
        totalPrice += qty * p["價格"];
      }
    });

    document.getElementById('submitBtn').disabled = true;
    statusMsg.style.color = "#aaa";
    statusMsg.innerText = "正在送出預購訂單...";

    try {
      const { error } = await db.from('orders').insert([{
        "團務名稱": selectedGroupName,
        "買家名稱": lineName,
        "手機號碼": phone,
        "Email": email,
        "訂單內容": selectedItems,
        "總金額": totalPrice,
        "處理狀態": "待確認"
      }]);

      if (error) throw error;

      statusMsg.style.color = "#10b981";
      statusMsg.innerText = "✓ 預購登記成功！";
      document.getElementById('lineName').value = "";
      document.getElementById('phone').value = "";
      document.getElementById('email').value = "";
      document.getElementById('agreeTerms').checked = false;
      orderQuantities = {};
      updateCartSummary();
      checkCanSubmit();
    } catch (err) {
      console.error(err);
      statusMsg.style.color = "#f87171";
      statusMsg.innerText = "送出失敗：" + err.message;
      document.getElementById('submitBtn').disabled = false;
    }
  }

  async function queryOrder() {
    let key = document.getElementById('searchKey').value.trim();
    let resultDiv = document.getElementById('queryResult');
    if (!key) { alert("請輸入手機或 Email！"); return; }

    resultDiv.innerHTML = "查詢中...";
    try {
      const { data: orders, error } = await db
        .from('orders')
        .select('*')
        .or(`手機號碼.eq.${key},Email.eq.${key}`);

      if (error) throw error;

      if (orders && orders.length > 0) {
        let html = "";
        orders.forEach(o => {
          let statusClass = o["處理狀態"] === "已成立" ? "status-confirmed" : (o["處理狀態"] === "已取消" ? "status-cancelled" : "status-pending");
          let itemsHtml = "";
          o["訂單內容"].forEach(i => { itemsHtml += `<div>• ${i.name} x ${i.qty} ($${i.price * i.qty})</div>`; });

          html += `
            <div class="card" style="font-size: 12px;">
              <div><b>團務名稱：</b>${o["團務名稱"]}</div>
              <div style="margin: 6px 0;"><b>預購項目：</b></div>
              <div style="background: #121212; padding: 6px; border-radius: 4px; margin-bottom: 6px;">${itemsHtml}</div>
              <div><b>金額總計：</b>$${o["總金額"]}</div>
              <div><b>處理狀態：</b><span class="${statusClass}">${o["處理狀態"]}</span></div>
            </div>
          `;
        });
        resultDiv.innerHTML = html;
      } else {
        resultDiv.innerHTML = "<p style='color:#f87171; text-align:center;'>查無相關預購紀錄。</p>";
      }
    } catch (err) {
      resultDiv.innerHTML = "<p style='color:#f87171; text-align:center;'>查詢發生錯誤。</p>";
    }
  }

  async function loadSurplusGroups() {
    let container = document.getElementById('surplusGroupList');
    container.innerHTML = "載入中...";
    try {
      const { data: groups, error } = await db.from('groups').select('*');
      if (error) throw error;

      if (groups && groups.length > 0) {
        let html = "<p style='color:#aaa; font-size:13px; margin-bottom:8px;'>請選擇要查看餘量的團務：</p>";
        groups.forEach(g => {
          html += `<button onclick="loadSurplusProducts('${g["團務名稱"]}')" style="display:block; width:100%; margin-bottom:6px; padding:10px; background:#242424; color:white; border:1px solid #444; border-radius:6px; text-align:left; cursor:pointer;">📦 ${g["團務名稱"]}</button>`;
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = "<p style='color:#aaa;'>目前沒有團務。</p>";
      }
    } catch (err) {
      container.innerHTML = "<p style='color:#f87171;'>載入失敗。</p>";
    }
  }

  async function loadSurplusProducts(groupName) {
    activeSurplusGroup = groupName;
    let container = document.getElementById('surplusProductList');
    container.innerHTML = "載入餘量商品中...";

    try {
      const { data: products, error } = await db
        .from('products').select('*').eq('團務名稱', groupName).gt('庫存餘量', 0);

      if (error) throw error;
      currentSurplusProducts = products || [];

      let html = `<h4 style="color:#fff; margin: 10px 0;">📂 ${groupName} 現貨餘量</h4>`;
      if (currentSurplusProducts.length > 0) {
        html += `
          <div style="background:#252525; padding:10px; margin-bottom:10px; border-radius:6px;">
            <input type="text" id="surplus_name" placeholder="Line / FB 暱稱 *" style="margin-bottom:6px;">
            <input type="text" id="surplus_phone" placeholder="手機號碼 *" style="margin-bottom:6px;">
          </div>
        `;
        currentSurplusProducts.forEach((p, index) => {
          html += `
            <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:bold; font-size:13px; color:#fff;">${p["商品名稱"]}</div>
                <div style="color:#10b981; font-size:12px;">$${p["價格"]} | <span style="color:#f59e0b;">剩餘：${p["庫存餘量"]} 個</span></div>
              </div>
              <select id="surplus_qty_${index}" style="width: 80px; padding: 4px;">
                <option value="0">0 個</option>`;
          for(let i=1; i<=p["庫存餘量"]; i++) { html += `<option value="${i}">${i} 個</option>`; }
          html += `</select></div>`;
        });
        html += `<button class="primary-btn" onclick="submitSurplusClaim()" style="margin-top:10px;">確認送出餘量認領</button>`;
      } else {
        html += "<p style='color:#aaa; font-size:12px;'>目前此團務沒有剩餘庫存囉！</p>";
      }
      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = "<p style='color:#f87171;'>載入餘量商品失敗。</p>";
    }
  }

  async function submitSurplusClaim() {
    let name = document.getElementById('surplus_name').value.trim();
    let phone = document.getElementById('surplus_phone').value.trim();
    if (!name || !phone) { alert("請填寫暱稱與手機號碼！"); return; }

    let selectedItems = [];
    let totalPrice = 0;
    currentSurplusProducts.forEach((p, index) => {
      let qty = parseInt(document.getElementById(`surplus_qty_${index}`).value) || 0;
      if (qty > 0) {
        selectedItems.push({ name: p["商品名稱"], price: p["價格"], qty: qty });
        totalPrice += qty * p["價格"];
      }
    });

    if (selectedItems.length === 0) { alert("請選擇欲認領的商品數量！"); return; }

    try {
      const { error } = await db.from('orders').insert([{
        "團務名稱": activeSurplusGroup, "買家名稱": name, "手機號碼": phone,
        "訂單內容": selectedItems, "總金額": totalPrice, "處理狀態": "待確認"
      }]);
      if (error) throw error;
      alert("✓ 餘量認領登記成功！");
      loadSurplusProducts(activeSurplusGroup);
    } catch (err) {
      alert("認領失敗：" + err.message);
    }
  }

  function toggleAdminLogin() {
    let form = document.getElementById('adminLoginForm');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  }

  async function verifyAdmin() {
    if (document.getElementById('adminPassword').value === "841250") { 
      document.getElementById('adminLoginForm').style.display = 'none';
      document.getElementById('adminDashboard').style.display = 'block';
      loadPendingOrders();
      loadGroupList(); // 確保下拉選單能同步載入
    } else { alert("密碼錯誤！"); }
  }

  // 批次新增商品進 Supabase
  async function submitBatchProducts() {
    let targetGroup = document.getElementById('adminTargetGroup').value;
    let rawText = document.getElementById('batchProductsInput').value.trim();
    let msgElem = document.getElementById('batchMsg');

    if (!targetGroup) { alert("請先選擇團務！"); return; }
    if (!rawText) { alert("請輸入要新增的商品資料！"); return; }

    msgElem.style.color = "#aaa";
    msgElem.innerText = "正在批次新增商品...";

    let lines = rawText.split('\n');
    let newProducts = [];

    for (let line of lines) {
      line = line.trim();
      if (!line) continue;
      let parts = line.split(/[,，]/);
      if (parts.length >= 2) {
        let pName = parts[0].trim();
        let pPrice = parseFloat(parts[1].trim());
        if (pName && !isNaN(pPrice)) {
          newProducts.push({
            "團務名稱": targetGroup,
            "商品名稱": pName,
            "價格": pPrice
          });
        }
      }
    }

    if (newProducts.length === 0) {
      msgElem.style.color = "#f87171";
      msgElem.innerText = "格式錯誤！請確保每行格式為：商品名稱, 價格";
      return;
    }

    try {
      const { error } = await db.from('products').insert(newProducts);
      if (error) throw error;

      msgElem.style.color = "#10b981";
      msgElem.innerText = `✓ 成功批次新增 ${newProducts.length} 項商品！`;
      document.getElementById('batchProductsInput').value = "";
    } catch (err) {
      console.error(err);
      msgElem.style.color = "#f87171";
      msgElem.innerText = "新增失敗：" + err.message;
    }
  }

  async function loadPendingOrders() {
    let container = document.getElementById('pendingOrdersList');
    container.innerHTML = "載入中...";
    try {
      const { data, err } = await db.from('orders').select('*').eq('處理狀態', '待確認');
      if (err) throw err;

      if (data && data.length > 0) {
        let html = "";
        data.forEach(o => {
          let itemsHtml = "";
          o["訂單內容"].forEach(i => { itemsHtml += `<div>• ${i.name} x ${i.qty} ($${i.price * i.qty})</div>`; });
          html += `
            <div class="card" style="font-size:12px;">
              <div><b>時間：</b>${new Date(o.created_at).toLocaleString()} | <b>團名：</b>${o["團務名稱"]}</div>
              <div><b>買家：</b>${o["買家名稱"]} (${o["手機號碼"]})</div>
              <div style="margin:4px 0; background:#121212; padding:6px; border-radius:4px;">${itemsHtml}</div>
              <div><b>總金額：</b>$${o["總金額"]}</div>
              <div style="display:flex; gap:6px; margin-top:8px;">
                <button onclick="updateOrderStatus(${o.id}, '已成立')" style="flex:1; background:#10b981; color:white; border:none; padding:6px; border-radius:4px; cursor:pointer;">✔️ 確認訂單</button>
                <button onclick="updateOrderStatus(${o.id}, '已取消')" style="flex:1; background:#ef4444; color:white; border:none; padding:6px; border-radius:4px; cursor:pointer;">❌ 取消訂單</button>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = "<p style='color:#aaa; font-size:12px;'>目前沒有待確認的訂單。</p>";
      }
    } catch (err) { container.innerHTML = "<p style='color:#f87171;'>載入訂單失敗。</p>"; }
  }

  async function updateOrderStatus(orderId, newStatus) {
    if (!confirm(`確定要將此訂單改為「${newStatus}」嗎？`)) return;
    try {
      const { error } = await db.from('orders').update({ "處理狀態": newStatus }).eq('id', orderId);
      if (error) throw error;
      alert("狀態更新成功！");
      loadPendingOrders();
    } catch (err) { alert("更新失敗：" + err.message); }
  }
</script>
