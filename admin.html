<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理員後台</title>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <style>
  /* 🛠️ 全局基本樣式 */
  body {
    background-color: #121212;
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px;
  }

  .admin-container {
    max-width: 98%;
    margin: 0 auto;
  }

  h2 {
    color: #3b82f6;
    border-bottom: 2px solid #333;
    padding-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .back-btn {
    background: #374151;
    color: #fff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
  .back-btn:hover { background: #4b5563; }
  
  /* 登入區塊 */
  #adminLoginBox {
    max-width: 400px;
    margin: 100px auto;
    background: #1e1e1e;
    padding: 30px;
    border-radius: 8px;
    border: 1px solid #333;
    text-align: center;
  }
  #adminLoginBox input {
    width: 100%;
    padding: 10px;
    margin: 15px 0;
    background: #2d2d2d;
    border: 1px solid #444;
    color: #fff;
    border-radius: 6px;
    box-sizing: border-box;
  }
  #adminLoginBox button {
    width: 100%;
    padding: 10px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  #adminLoginBox button:hover { background: #1d4ed8; }

  /* 📊 後台表單與卡片整體美化 */
  .admin-container form, 
  .admin-container div[style*="margin: 15px"] {
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    margin-bottom: 20px;
  }

  /* 輸入框與文字區域美化 */
  .admin-container input[type="text"],
  .admin-container input[type="url"],
  .admin-container textarea,
  .admin-container select {
    width: 100%;
    background: #27272a;
    border: 1px solid #3f3f46;
    border-radius: 8px;
    color: #ffffff;
    padding: 10px 14px;
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 16px;
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .admin-container input:focus,
  .admin-container textarea:focus,
  .admin-container select:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }

  /* 標籤文字 */
  .admin-container label, 
  .admin-container span {
    font-size: 13px;
    color: #d4d4d8;
    font-weight: 500;
  }

  /* 一般送出與操作按鈕美化 */
  .admin-container button[type="submit"],
  .admin-container button:not(.back-btn):not([id^="btn-"]) {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: bold;
    width: 100%;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
    margin-top: 10px;
  }

  .admin-container button[type="submit"]:hover,
  .admin-container button:not(.back-btn):not([id^="btn-"]):hover {
    opacity: 0.9;
  }

  /* 分頁內容與表格樣式 */
  .admin-tab-content { display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; color: #e5e7eb; }
  th, td { padding: 10px 12px; border-bottom: 1px solid #333; text-align: left; }
  th { background: #2d2d2d; color: #9ca3af; }
</style>
</head>
<body>

  <script>
  let currentGroupMode = "create"; // 'create' 或 'edit'
let allGroupsData = []; // 暫存所有團務原始資料

   function switchAdminGroupTab(mode) {
  currentGroupMode = mode;
  let btnCreate = document.getElementById('tabCreateGroupBtn');
  let btnEdit = document.getElementById('tabEditGroupBtn');
  let selectBox = document.getElementById('editGroupSelectBox');
  let submitBtn = document.getElementById('groupSubmitBtn');
  let msgElem = document.getElementById('createGroupMsg');
  let deleteBtn = document.getElementById('groupDeleteBtn');
  let productEditBox = document.getElementById('groupProductEditBox');

  if (msgElem) msgElem.innerText = "";

  if (mode === 'create') {
    btnCreate.style.background = "#2563eb";
    btnCreate.style.color = "#fff";
    btnEdit.style.background = "#444";
    btnEdit.style.color = "#ccc";
    selectBox.style.display = "none";
    submitBtn.innerText = "建立新團務";
    submitBtn.style.background = "#2563eb";
    if (deleteBtn) deleteBtn.style.display = "none";
    if (productEditBox) productEditBox.style.display = "none";
    clearGroupForm();
  } else {
    btnEdit.style.background = "#2563eb";
    btnEdit.style.color = "#fff";
    btnCreate.style.background = "#444";
    btnCreate.style.color = "#ccc";
    selectBox.style.display = "block";
    if (submitBtn) {
    submitBtn.innerText = "💾 儲存修改內容";
}
    submitBtn.style.background = "#10b981";
    if (deleteBtn) deleteBtn.style.display = "block";
    if (productEditBox) productEditBox.style.display = "block";
    loadGroupSelectForEdit();
  }
}
window.switchAdminGroupTab = switchAdminGroupTab;

// 2. 載入編輯團務下拉選單
async function loadGroupSelectForEdit() {
  const selectElem = document.getElementById('editGroupSelect');
  if (!selectElem) return;
  selectElem.innerHTML = "<option value=''>載入中...</option>";
  try {
    const { data, error } = await db.from('groups').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    allGroupsData = data || [];
    if (allGroupsData.length === 0) {
      selectElem.innerHTML = "<option value=''>尚無任何團務</option>";
      return;
    }
    selectElem.innerHTML = "<option value=''>-- 請選擇欲編輯的團務 --</option>";
    allGroupsData.forEach(g => {
      selectElem.innerHTML += `<option value="${g.id}">${g["團務名稱"]}</option>`;
    });
  } catch (err) {
    alert("載入團務失敗：" + err.message);
  }
}

// 3. 選擇團務時自動帶入表單欄位與商品清單
function onSelectGroupToEdit() {
  let selectedId = document.getElementById('editGroupSelect').value;
  if (!selectedId) {
    clearGroupForm();
    const container = document.getElementById('productListContainer');
    if (container) container.innerHTML = "";
    return;
  }
  let group = allGroupsData.find(g => String(g.id) === String(selectedId));
  if (group) {
    document.getElementById('editingGroupId').value = group.id;
    document.getElementById('newGroupName').value = group["團務名稱"] || "";
    document.getElementById('newGroupImg').value = group["圖片"] || "";
    document.getElementById('newGroupDeadline').value = group["截單時間"] || "";
    document.getElementById('newGroupPayment').value = group["付款方式"] || "賣貨便貨到付款(不含運費38)";
    document.getElementById('newGroupRemark').value = group["團務備註"] || "";
  }
  const editBox = document.getElementById('groupProductEditBox');
  if (editBox) editBox.style.display = 'block';
  
  if (typeof loadProductsForEdit === 'function') {
    loadProductsForEdit(selectedId);
  }
}
window.onSelectGroupToEdit = onSelectGroupToEdit;

// 4. 清空表單
function clearGroupForm() {
  document.getElementById('editingGroupId').value = "";
  document.getElementById('newGroupName').value = "";
  document.getElementById('newGroupImg').value = "";
  document.getElementById('newGroupDeadline').value = "";
  document.getElementById('newGroupPayment').value = "賣貨便貨到付款(不含運費38)";
  document.getElementById('newGroupRemark').value = "";
}

// 5. 統一提交表單
async function submitGroupForm() {
  let gName = document.getElementById('newGroupName')?.value.trim();
  let gImg = document.getElementById('newGroupImg')?.value.trim();
  let gDeadline = document.getElementById('newGroupDeadline')?.value.trim() || "未定";
  let gPayment = document.getElementById('newGroupPayment')?.value.trim() || "賣貨便貨到付款(不含運費38)";
  let gRemark = document.getElementById('newGroupRemark')?.value.trim() || "";
  let msgElem = document.getElementById('createGroupMsg');
  let editingId = document.getElementById('editingGroupId')?.value;

  if (!gName) {
    alert("請填寫團務名稱！");
    return;
  }

  if (msgElem) {
    msgElem.style.color = "#aaa";
    msgElem.innerText = currentGroupMode === 'create' ? "正在建立團務..." : "正在儲存修改...";
  }

  let payload = {
    "團務名稱": gName,
    "圖片": gImg,
    "截單時間": gDeadline,
    "團務備註": gRemark,
    "付款方式": gPayment
  };

  try {
    if (currentGroupMode === 'create') {
      payload["isExpired"] = false;
      const { error } = await db.from('groups').insert([payload]);
      if (error) throw error;
      alert(`✓ 成功建立團務：「${gName}」！`);
    } else {
      if (!editingId) {
        alert("請先選擇要編輯的團務！");
        return;
      }
      const { error } = await db.from('groups').update(payload).eq('id', editingId);
      if (error) throw error;
      alert(`✓ 團務「${gName}」已更新成功！`);
    }

    if (msgElem) {
      msgElem.style.color = "#10b981";
      msgElem.innerText = "✓ 操作成功！";
    }
    clearGroupForm();
    if (typeof loadGroupList === 'function') await loadGroupList();
    if (currentGroupMode === 'edit') await loadGroupSelectForEdit();

  } catch (err) {
    if (msgElem) {
      msgElem.style.color = "#f87171";
      msgElem.innerText = "操作失敗：" + err.message;
    }
    alert("操作失敗：" + err.message);
  }
}
window.submitGroupForm = submitGroupForm;
window.submitCreateGroup = submitGroupForm;
  let currentGroupTab = 'active'; // 預設顯示開團中

// 1. 切換分頁按鈕並更新樣式
function switchGroupTab(tab) {
  currentGroupTab = tab;
  
  let btnActive = document.getElementById('tabActive');
  let btnExpired = document.getElementById('tabExpired');
  
  if (btnActive && btnExpired) {
    if (tab === 'active') {
      btnActive.style.background = '#2563eb';
      btnActive.style.color = '#fff';
      btnExpired.style.background = '#2f2f35';
      btnExpired.style.color = '#aaa';
    } else {
      btnExpired.style.background = '#2563eb';
      btnExpired.style.color = '#fff';
      btnActive.style.background = '#2f2f35';
      btnActive.style.color = '#aaa';
    }
  }
  
  // 重新渲染清單
  renderGroupsList();
  }

    // 📦 讀取並顯示指定團務底下的商品清單供編輯（含圖片網址與商品說明）
async function loadProductsForEdit(groupId) {

  // 輔助函式：觸發瀏覽器下載 CSV 檔案（包含 UTF-8 BOM 防止 Excel 簡體/繁體亂碼）
function downloadCSV(filename, csvContent) {
  const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  const url = URL.createObjectURL(blob);
  link.setAttribute("href", url);
  link.setAttribute("download", filename);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// 📊 匯出團務商品採購總數表 (已移除商品分類欄位)
async function exportProductSummaryCSV() {
  const selectEl = document.getElementById('exportGroupSelect');
  const selectedGroup = selectEl ? selectEl.value.replace(/\r?\n|\r/g, '').trim() : "ALL";

  try {
    const { data: allOrders, error } = await db.from('orders').select('*');
    if (error || !allOrders || allOrders.length === 0) {
      alert("目前 orders 資料表中沒有任何訂單！");
      return;
    }

    const summaryMap = {};
    let validCount = 0;

    allOrders.forEach(ord => {
      if (ord.status === '已取消') return;

      const groupName = String(ord['團務名稱'] || ord.group_name || ord['團名'] || '未分類團務').replace(/\r?\n|\r/g, '').trim();
      
      if (selectedGroup !== "ALL" && groupName !== selectedGroup) return;

      validCount++;

      let itemsList = ord['訂單內容'] || ord.items || ord['商品列表'] || [];
      if (typeof itemsList === 'string') {
        try { itemsList = JSON.parse(itemsList); } catch(e) { itemsList = []; }
      }

      if (Array.isArray(itemsList)) {
        itemsList.forEach(item => {
          const pName = item.name || item['商品名稱'] || '未知商品';
          const pPrice = Number(item.price || item['單價'] || 0);
          const pQty = Number(item.qty || item['數量'] || 1);

          // Key 改為僅以 團名 + 商品名稱 組合
          const key = `${groupName}__${pName}`;

          if (!summaryMap[key]) {
            summaryMap[key] = { group: groupName, name: pName, price: pPrice, totalQty: 0 };
          }
          summaryMap[key].totalQty += pQty;
        });
      }
    });

    if (validCount === 0) {
      alert(`找不到「${selectedGroup}」的有效訂單！`);
      return;
    }

    const sortedSummary = Object.values(summaryMap).sort((a, b) => {
      if (a.group !== b.group) return a.group.localeCompare(b.group);
      return a.name.localeCompare(b.name);
    });

    // 表頭移除「商品分類」
    let csv = "團務名稱,商品名稱,單價,總預購數量,預估總金額\n";

    sortedSummary.forEach(item => {
      const gName = `"${item.group.replace(/"/g, '""')}"`;
      const pName = `"${item.name.replace(/"/g, '""')}"`;
      const totalPrice = item.price * item.totalQty;

      // 資料列移除商品分類
      csv += `${gName},${pName},${item.price},${item.totalQty},${totalPrice}\n`;
    });

    const today = new Date().toISOString().split('T')[0];
    const fileName = selectedGroup === "ALL" ? `商品採購總數表_全部團務_${today}.csv` : `商品採購總數表_${selectedGroup}_${today}.csv`;
    downloadCSV(fileName, csv);
  } catch (err) {
    console.error("匯出失敗：", err);
    alert("匯出採購統計失敗：" + err.message);
  }
}

  async function submitBatchProducts() {
  try {
    // 1. 改用正確的下拉選單 id: editGroupSelect
    let groupSelect = document.getElementById('editGroupSelect');
    if (!groupSelect) {
      alert("找不到群組選擇元件 (editGroupSelect)");
      return;
    }
    
    let selectedId = groupSelect.value;
    if (!selectedId) {
      alert("請先選擇團務！");
      return;
    }

    // 取得選中的團務名稱（從 allGroupsData 裡面找到對應的團務名稱）
    let group = allGroupsData ? allGroupsData.find(g => String(g.id) === String(selectedId)) : null;
    let targetGroup = group ? group["團務名稱"] : document.getElementById('newGroupName').value;

    if (!targetGroup) {
      alert("無法取得目前的團務名稱，請確認是否已選擇團務！");
      return;
    }

    // 2. 檢查輸入框
    let inputElem = document.getElementById('batchProductsInput');
    if (!inputElem) {
      alert("找不到輸入框元件 (batchProductsInput)");
      return;
    }
    let rawText = inputElem.value.trim();
    if (!rawText) {
      alert("請輸入要新增的商品資料！");
      return;
    }

    let msgElem = document.getElementById('batchMsg');
    if (msgElem) {
      msgElem.style.color = "#aaa";
      msgElem.innerText = "正在解析並新增商品...";
    }

    // 3. 處理文字與換行（支援從試算表複製過來的 Tab 與多行格式）
    let lines = rawText.split('\n');
    let newProducts = [];

    for (let line of lines) {
      line = line.trim();
      if (!line) continue;

      let parts = line.includes('\t') ? line.split('\t') : line.split(/\s+/);
      parts = parts.map(p => p.trim()).filter(p => p !== "");

      if (parts.length >= 3) {
        let pCat = parts[0] || "一般";
        let pName = parts[1] || "";
        let pPrice = parseFloat(parts[2]) || 0;
        let pImg = parts[3] || "";
        let pDesc = parts.slice(4).join(" ");

        // 修正 Google 雲端硬碟或其他網址內的空格問題
        pImg = pImg.replace(/(\?|\&)\s+/g, '$1');

        if (pName && !isNaN(pPrice)) {
          newProducts.push({
            "團務名稱": targetGroup,
            "商品分類": pCat,
            "商品名稱": pName,
            "單價": pPrice,
            "圖片": typeof formatImageUrl === 'function' ? formatImageUrl(pImg) : pImg,
            "商品說明": pDesc,
            "isExpired": false
          });
        }
      }
    }

    if (newProducts.length === 0) {
      if (msgElem) {
        msgElem.style.color = "#f87171";
        msgElem.innerText = "解析失敗！沒有成功抓到任何商品（請確認順序：分類, 名稱, 單價）。";
      } else {
        alert("解析失敗！沒有成功抓到任何商品。");
      }
      return;
    }

    // 4. 寫入 Supabase 資料庫
    if (typeof db === 'undefined') {
      alert("資料庫物件 (db) 未定義！");
      return;
    }

    const { error } = await db.from('products').insert(newProducts);
    if (error) throw error;
    
    if (msgElem) {
      msgElem.style.color = "#10b981";
      msgElem.innerText = `✓ 成功批次新增 ${newProducts.length} 項商品！`;
    } else {
      alert(`✓ 成功批次新增 ${newProducts.length} 項商品！`);
    }

    inputElem.value = "";
    
    // 重新載入該團務的商品列表
    if (typeof loadProductsForEdit === 'function') {
      loadProductsForEdit(selectedId);
    }

  } catch (err) {
    console.error(err);
    alert("批次新增發生錯誤：" + err.message);
  }
}

      orderIdStr.includes(keyword) || // 👈 支援用訂單編號搜尋（不分大小寫，也可以輸入部分編號）
      (o["買家名稱"] && o["買家名稱"].toLowerCase().includes(keyword)) ||
      (o["手機號碼"] && o["手機號碼"].toLowerCase().includes(keyword)) ||
      (o["Email"] && o["Email"].toLowerCase().includes(keyword));

    let matchGroup = !selectedGroup || o["團務名稱"] === selectedGroup;

    return matchKeyword && matchGroup;
  });

  renderOrdersTable(filtered);
}
window.filterOrders = filterOrders;

// 📋 更新篩選團務的下拉選單
function updateFilterGroupOptions(orders) {
  const select = document.getElementById('filterGroupSelect');
  if (!select) return;

  let groups = [...new Set(orders.map(o => o["團務名稱"]).filter(Boolean))];
  let currentVal = select.value;

  let html = '<option value="">所有團務</option>';
  groups.forEach(g => {
    html += `<option value="${g}">${g}</option>`;
  });
  select.innerHTML = html;
  select.value = currentVal;
}
  function openModifyModal(order) {
    let orderId = order.id;
    let modalBg = document.createElement('div');
    modalBg.style.cssText = "position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000;";
    
    let modalBox = document.createElement('div');
    modalBox.style.cssText = "background: #1e1e1e; padding: 20px; border-radius: 10px; width: 95%; max-width: 500px; color: #fff; font-size: 13px; max-height: 90vh; overflow-y: auto;";
    
    let itemsHtml = "";
    (order["訂單內容"] || []).forEach((item, idx) => {
        itemsHtml += `
            <div style="background: #2a2a2a; padding: 10px; border-radius: 6px; margin-bottom: 8px;" class="modify-item-row" data-index="${idx}">
                <div style="font-weight: bold; margin-bottom: 4px;">${item.name}</div>
                <div style="display: flex; gap: 10px;">
                    <div>
                        單價：<input type="number" class="item-price" value="${item.price}" style="width: 80px; padding: 4px; background: #121212; border: 1px solid #444; color: #fff; border-radius: 4px;">
                    </div>
                    <div>
                        數量：<input type="number" class="item-qty" value="${item.qty}" min="0" style="width: 60px; padding: 4px; background: #121212; border: 1px solid #444; color: #fff; border-radius: 4px;">
                    </div>
                </div>
            </div>
        `;
    });

    modalBox.innerHTML = `
        <h3 style="margin-bottom: 12px; text-align: center;">修改訂單內容 (${order["買家名稱"]})</h3>
        <div id="modifyItemsContainer">${itemsHtml}</div>
        <div style="margin: 15px 0; font-size: 15px; font-weight: bold; text-align: right; color: #60a5fa;" id="modalTotalPrice">
            新總金額：$${order["總金額"]}
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button id="saveModifyBtn" style="background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">儲存變更</button>
            <button id="closeModifyBtn" style="background: #555; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">取消</button>
        </div>
    `;

    modalBg.appendChild(modalBox);
    document.body.appendChild(modalBg);

    const calculateTotal = () => {
        let total = 0;
        let rows = modalBox.querySelectorAll('.modify-item-row');
        rows.forEach(row => {
            let price = parseFloat(row.querySelector('.item-price').value) || 0;
            let qty = parseInt(row.querySelector('.item-qty').value) || 0;
            total += price * qty;
        });
        modalBox.querySelector('#modalTotalPrice').innerText = `新總金額：$${total}`;
        return total;
    };

    modalBox.querySelectorAll('.item-price, .item-qty').forEach(input => {
        input.addEventListener('input', calculateTotal);
    });

    modalBox.querySelector('#closeModifyBtn').onclick = () => {
        document.body.removeChild(modalBg);
    };

    modalBox.querySelector('#saveModifyBtn').onclick = async () => {
        let newItems = [];
        let rows = modalBox.querySelectorAll('.modify-item-row');

        rows.forEach(row => {
            let idx = row.getAttribute('data-index');
            let origItem = order["訂單內容"][idx];
            let price = parseFloat(row.querySelector('.item-price').value);
            let qty = parseInt(row.querySelector('.item-qty').value);

            if (qty > 0) {
                newItems.push({
                    ...origItem,
                    price: price,
                    qty: qty
                });
            }
        });

        if (newItems.length === 0) {
            alert("訂單內至少需保留一項商品！");
            return;
        }

        let newTotal = calculateTotal();
        let changeReason = prompt("請輸入變更訂單的原因或備註說明（選填）：", "商品數量/價格調整") || "無";

        if (!confirm(`確定要儲存變更嗎？\n新總金額將改為：$${newTotal}`)) return;

        try {
            const { error } = await db.from('orders').update({
                "訂單內容": newItems,
                "總金額": newTotal,
                "處理狀態": "已變更"
            }).eq('id', orderId);

            if (error) throw error;

            let paymentMethod = "事先匯款";
            const { data: groupData, error: groupError } = await db.from('groups').select('*').eq('團務名稱', order["團務名稱"]).single();
            if (!groupError && groupData && groupData["付款方式"]) {
                paymentMethod = groupData["付款方式"];
            }

            let productText = newItems.map(i => `${i.name} x ${i.qty} ($${i.price} / 小計: $${i.price * i.qty})`).join("\n");

            if (typeof sendPreOrderEmail === 'function') {
                try {
                    await sendPreOrderEmail({
                        customerEmail: order["Email"], 
                        subject: `【REO代購】${order["團務名稱"]} 訂單修改通知`, // 👈 加上這行主旨
                        lineName: order["買家名稱"],              
                        groupName: order["團務名稱"],             
                        productDetails: productText,        
                        totalPrice: newTotal,              
                        paymentMethod: paymentMethod, 
                        status: "已變更",                            
                        changeReason: changeReason,
                       orderId: orderId
                    });
                } catch (emailErr) {
                    console.error("【寄信失敗完整物件】", emailErr);
                    let errMsg = emailErr.message || emailErr.error || JSON.stringify(emailErr, null, 2);
                    alert("訂單已更新，但通知信發送失敗：" + errMsg);
                }
            }

            alert("訂單已成功修改、更新並已發送通知信！");
            document.body.removeChild(modalBg);
            loadAllOrders();
            loadPendingOrders();
        } catch (err) {
            alert("更新失敗：" + err.message);
        }
    }
  }
  // 🚀 強制解除卡在「載入團務列表中...」的死結
window.addEventListener('load', async () => {
    console.log("強制啟動載入機制...");
    try {
        if (typeof loadGroupList === 'function') {
            await loadGroupList();
        } else if (typeof loadGroups === 'function') {
            await loadGroups();
        } else {
            // 如果找不到原本的函數，直接手動抓取 groups 資料填入畫面
            const { data, error } = await db.from('groups').select('*');
            if (!error && data) {
                console.log("成功手動抓取到團務資料：", data);
                // 這裡會自動去找畫面上的容器並把「載入中...」覆蓋掉
                let container = document.querySelector('#groupContainer') || document.querySelector('.group-container');
                if (container) {
                    container.innerHTML = data.map(g => `<div style="padding:10px; background:#222; margin-bottom:5px; border-radius:6px; color:#fff;">${g["團務名稱"]}</div>`).join('');
                }
            }
        }
    } catch (e) {
        console.error("強制載入失敗原因：", e);
    }
});

  const lineNameInput = document.getElementById('lineName');
  const phoneInput = document.getElementById('phone');
  const emailInput = document.getElementById('email');

  if (lineNameInput && localStorage.getItem('reo_buyer_lineName')) {
    lineNameInput.value = localStorage.getItem('reo_buyer_lineName');
  }
  if (phoneInput && localStorage.getItem('reo_buyer_phone')) {
    phoneInput.value = localStorage.getItem('reo_buyer_phone');
  }
  if (emailInput && localStorage.getItem('reo_buyer_email')) {
    emailInput.value = localStorage.getItem('reo_buyer_email');
  }
});
