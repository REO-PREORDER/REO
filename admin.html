<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理員後台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <style>
  /* 🛠️ 全局基本樣式 */
  body {
    background-color: #121212;
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px;
  }

  .admin-container {
    max-width: 98%;
    margin: 0 auto;
  }

  h2 {
    color: #3b82f6;
    border-bottom: 2px solid #333;
    padding-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .back-btn {
    background: #374151;
    color: #fff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
  .back-btn:hover { background: #4b5563; }
  
  /* 登入區塊 */
  #adminLoginBox {
    max-width: 400px;
    margin: 100px auto;
    background: #1e1e1e;
    padding: 30px;
    border-radius: 8px;
    border: 1px solid #333;
    text-align: center;
  }
  #adminLoginBox input {
    width: 100%;
    padding: 10px;
    margin: 15px 0;
    background: #2d2d2d;
    border: 1px solid #444;
    color: #fff;
    border-radius: 6px;
    box-sizing: border-box;
  }
  #adminLoginBox button {
    width: 100%;
    padding: 10px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  #adminLoginBox button:hover { background: #1d4ed8; }

  /* 📊 後台表單與卡片整體美化 */
  .admin-container form, 
  .admin-container div[style*="margin: 15px"] {
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    margin-bottom: 20px;
  }

  /* 輸入框與文字區域美化 */
  .admin-container input[type="text"],
  .admin-container input[type="url"],
  .admin-container textarea,
  .admin-container select {
    width: 100%;
    background: #27272a;
    border: 1px solid #3f3f46;
    border-radius: 8px;
    color: #ffffff;
    padding: 10px 14px;
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 16px;
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .admin-container input:focus,
  .admin-container textarea:focus,
  .admin-container select:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }

  /* 標籤文字 */
  .admin-container label, 
  .admin-container span {
    font-size: 13px;
    color: #d4d4d8;
    font-weight: 500;
  }

  /* 一般送出與操作按鈕美化 */
  .admin-container button[type="submit"],
  .admin-container button:not(.back-btn):not([id^="btn-"]) {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: bold;
    width: 100%;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
    margin-top: 10px;
  }

  .admin-container button[type="submit"]:hover,
  .admin-container button:not(.back-btn):not([id^="btn-"]):hover {
    opacity: 0.9;
  }

  /* 分頁內容與表格樣式 */
  .admin-tab-content { display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; color: #e5e7eb; }
  th, td { padding: 10px 12px; border-bottom: 1px solid #333; text-align: left; }
  th { background: #2d2d2d; color: #9ca3af; }
</style>
</head>
<body>

  <!-- 🔒 管理員登入畫面 (預設顯示) -->
  <div id="adminLoginBox">
    <h3>🔐 管理員登入</h3>
    <p style="font-size: 12px; color: #9ca3af;">請輸入管理員密碼以進入後台</p>
    <input type="password" id="adminPasswordInput" placeholder="請輸入密碼">
    <button onclick="checkAdminPassword()">登入後台</button>
    <p id="adminLoginMsg" style="color: #ef4444; font-size: 12px; margin-top: 10px;"></p>
  </div>

  <!-- 📊 獨立管理員後台主面板 (登入後顯示) -->
  <div id="adminDashboard" class="admin-container" style="display: none;">
    <h2>
      <span>🛠️ REO代購 - 管理員控制面板</span>
      <a href="index.html" class="back-btn">🏠 返回前台首頁</a>
    </h2>

    <div style="margin: 15px auto 0 auto; width: 98%; max-width: 100%; text-align: left; padding: 0 15px;"> 
      <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">

      <!-- 💡 分頁切換按鈕列 -->
      <div style="display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #3f3f46; padding-bottom: 12px; flex-wrap: wrap;">
        <button onclick="switchAdminTab('groups')" id="btn-groups" style="background: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s;">⚙️ 團務管理工具</button>
        <button onclick="switchAdminTab('orders')" id="btn-orders" style="background: #27272a; color: #a1a1aa; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s;">📋 所有訂單紀錄</button>
        <button onclick="switchAdminTab('splitBoard')" id="btn-splitBoard" style="background: #27272a; color: #a1a1aa; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s;">📦 拆團方格看板</button>
        <button onclick="switchAdminTab('export')" id="btn-export" style="background: #27272a; color: #a1a1aa; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s;">📊 匯出訂單資料</button>
      </div>

      <!-- ========================================== -->
      <!-- 📦 1. 團務管理工具分頁 (id="tab-groups") -->
      <!-- ========================================== -->
      <div id="tab-groups" class="admin-tab-content" style="display: block;">
        
        <div style="display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px;">
          <button id="tabCreateGroupBtn" onclick="switchAdminGroupTab('create')" style="background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">➕ 新增團務</button>
          <button id="tabEditGroupBtn" onclick="switchAdminGroupTab('edit')" style="background: #444; color: #ccc; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">✏️ 編輯既有團務</button>
        </div>

        <div id="editGroupSelectBox" style="display: none; margin-bottom: 12px; background: #1a1a1a; padding: 10px; border-radius: 6px; border: 1px solid #3b82f6;">
          <label style="font-size: 12px; color: #60a5fa; font-weight: bold;">請選擇要編輯的團務：</label>
          <select id="editGroupSelect" onchange="onSelectGroupToEdit(); loadProductsForEdit(this.value);" style="width: 100%; padding: 6px; margin-top: 5px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; font-size: 13px;"></select>
        </div>

        <input type="hidden" id="editingGroupId" value="">
        
        <label style="font-size: 12px; color: #ccc;">團務名稱 *</label>
        <input type="text" id="newGroupName" placeholder="例如：銀魂- 萬代 閃徽 - 1月預購" style="margin-top: 4px;">

        <label style="font-size: 12px; color: #ccc;">團務圖片網址 (可貼 Google Drive 連結或一般圖片網址)</label>
        <input type="text" id="newGroupImg" placeholder="https://..." style="margin-top: 4px;">

        <div style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label style="font-size: 12px; color: #ccc;">截單時間</label>
            <input type="text" id="newGroupDeadline" placeholder="例如：10/7 18:00" style="margin-top: 4px;">
          </div>
          <div style="flex: 1;">
            <label style="font-size: 12px; color: #ccc;">付款方式</label>
            <input type="text" id="newGroupPayment" placeholder="例如：賣貨便貨到付款(不含運費)" value="賣貨便貨到付款(不含運費)" style="margin-top: 4px;">
          </div>
        </div>

        <label style="font-size: 12px; color: #ccc;">團務備註 (代購須知下方顯示的特有備註)</label>
        <textarea id="newGroupRemark" rows="3" placeholder="例如：⚠️ 可能砍單..." style="margin-top: 4px;"></textarea>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
          <button id="groupSubmitBtn" class="primary-btn" onclick="submitGroupForm()" style="background: #2563eb; flex: 2;">建立新團務</button>
          <button id="groupDeleteBtn" onclick="deleteCurrentGroup()" style="display: none; background: #dc2626; color: white; border: none; border-radius: 6px; padding: 8px; cursor: pointer; font-size: 12px; font-weight: bold; flex: 1;">🗑️ 刪除團務(含商品)</button>
        </div>
        <p id="createGroupMsg" style="margin-top: 8px; font-size: 12px; text-align: center;"></p>

        <div id="groupProductEditBox" style="display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #555;">
          <h5 style="color: #f59e0b; margin-bottom: 10px;">🛍️ 編輯該團務商品內容</h5>
          <div id="productListContainer" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

      </div>

      <!-- ========================================== -->
      <!-- 📋 2. 所有訂單紀錄分頁 (id="tab-orders") -->
      <!-- ========================================== -->
      <div id="tab-orders" class="admin-tab-content" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h4 style="color: #10b981; margin: 0; white-space: nowrap;">📋 所有訂單紀錄</h4>
          <button onclick="if(typeof loadAllOrders === 'function') loadAllOrders();" style="background: #2563eb; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; width: 95px; flex-shrink: 0;">🔄 重新整理</button>
        </div>
        <div style="background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
          
          <div style="display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="searchOrderInput" placeholder="🔍 搜尋買家姓名 / 訂單編號" oninput="filterOrders()" style="flex: 2; min-width: 180px; padding: 8px 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; font-size: 13px;">
            <select id="filterGroupSelect" onchange="filterOrders()" style="flex: 1.5; min-width: 150px; padding: 8px 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; font-size: 13px;">
              <option value="">📂 所有團務（不限）</option>
            </select>
            <select id="filterStatusSelect" onchange="filterOrders()" style="flex: 1; min-width: 120px; padding: 8px 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; font-size: 13px;">
              <option value="">📋 所有狀態</option>
              <option value="待確認">待確認</option>
              <option value="已成立">已成立</option>
              <option value="已變更">已變更</option>
              <option value="已取消">已取消</option>
            </select>
          </div>

          <div id="allOrdersTableContainer" style="width: 100%; background: #1a1a1a; border-radius: 6px; border: 1px solid #333; margin-bottom: 20px;">    
            <table>
              <thead>
                <tr style="background: #2d2d2d; text-align: left; border-bottom: 2px solid #444;">
                  <th style="padding: 10px 12px; color: #9ca3af; width: 80px;">訂單編號</th>
                  <th style="padding: 10px 12px; color: #9ca3af; width: 130px;">時間</th>
                  <th style="padding: 10px 12px; color: #9ca3af; width: 90px;">買家姓名</th>
                  <th style="padding: 10px 12px; color: #9ca3af; width: 180px;">團務名稱</th>
                  <th style="padding: 10px 12px; color: #9ca3af; min-width: 300px;">商品明細</th> 
                  <th style="padding: 10px 12px; color: #9ca3af; width: 80px;">總金額</th>
                  <th style="padding: 10px 12px; color: #9ca3af; width: 80px;">訂單狀態</th>
                  <th style="padding: 10px 12px; color: #9ca3af; width: 120px;">買家備註</th>
                  <th style="padding: 10px 12px; color: #fbbf24; width: 120px;">管理員備註</th>
                  <th style="padding: 10px 12px; color: #9ca3af; text-align: center; width: 100px;">操作</th>
                </tr>
              </thead>
              <tbody id="allOrdersTbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ========================================== -->
      <!-- 📦 3. 拆團方格看板分頁 (id="tab-splitBoard") -->
      <!-- ========================================== -->
      <div id="tab-splitBoard" class="admin-tab-content" style="display: none;">
        <h4 style="color: #60a5fa; margin-bottom: 10px;">📦 拆團方格看板（依序模擬分盒）</h4>
        <div style="background: #18181b; padding: 15px; border-radius: 8px; border: 1px solid #27272a; margin-bottom: 20px;">
          
          <div style="margin-bottom: 15px;">
            <label style="font-size: 13px; color: #60a5fa; font-weight: bold;">選擇拆團項目：</label>
            <select id="splitGroupSelect" onchange="loadSplitBoardData()" style="width: 100%; padding: 8px; margin-top: 5px; background: #27272a; color: #fff; border: 1px solid #3f3f46; border-radius: 6px; font-size: 13px;">
              <option value="">-- 請選擇要檢視的拆團 --</option>
            </select>
          </div>

          <div id="splitSummaryStats" style="display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; font-size: 13px; color: #d4d4d8;"></div>

          <div id="splitBoardTableContainer" style="width: 100%; overflow-x: auto; background: #121212; border: 1px solid #333; border-radius: 6px; padding: 15px;">
            <p style="color: #888; text-align: center; font-size: 13px;">請先上方選擇一個拆團，以展開方格看板。</p>
          </div>

        </div>
      </div>

      <!-- ========================================== -->
      <!-- 📊 4. 匯出訂單資料分頁 (id="tab-export") -->
      <!-- ========================================== -->
      <div id="tab-export" class="admin-tab-content" style="display: none;">
        <h4 style="color: #f59e0b; margin-bottom: 10px; text-align: center;">📤 匯出訂單資料</h4>
        <div style="background: #252525; padding: 15px; border-radius: 8px;">
          <label style="font-size: 12px; color: #ccc;">選擇要匯出的團務：</label>
          <select id="exportGroupSelect" style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;"></select>
          
          <div style="display: flex; gap: 10px;">
            <button onclick="exportBuyerOrdersCSV()" style="background: #059669; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">📥 匯出 CSV (Excel)</button>
            <button onclick="exportProductSummaryCSV()" style="background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">📊 匯出採購總數表</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let currentGroupMode = "create";
    let allGroupsData = [];

    function switchAdminGroupTab(mode) {
      currentGroupMode = mode;
      let btnCreate = document.getElementById('tabCreateGroupBtn');
      let btnEdit = document.getElementById('tabEditGroupBtn');
      let selectBox = document.getElementById('editGroupSelectBox');
      let submitBtn = document.getElementById('groupSubmitBtn');
      let msgElem = document.getElementById('createGroupMsg');
      let deleteBtn = document.getElementById('groupDeleteBtn');
      let productEditBox = document.getElementById('groupProductEditBox');

      if (msgElem) msgElem.innerText = "";

      if (mode === 'create') {
        btnCreate.style.background = "#2563eb";
        btnCreate.style.color = "#fff";
        btnEdit.style.background = "#444";
        btnEdit.style.color = "#ccc";
        selectBox.style.display = "none";
        submitBtn.innerText = "建立新團務";
        submitBtn.style.background = "#2563eb";
        if (deleteBtn) deleteBtn.style.display = "none";
        if (productEditBox) productEditBox.style.display = "none";
        clearGroupForm();
      } else {
        btnEdit.style.background = "#2563eb";
        btnEdit.style.color = "#fff";
        btnCreate.style.background = "#444";
        btnCreate.style.color = "#ccc";
        selectBox.style.display = "block";
        if (submitBtn) submitBtn.innerText = "💾 儲存修改內容";
        submitBtn.style.background = "#10b981";
        if (deleteBtn) deleteBtn.style.display = "block";
        if (productEditBox) productEditBox.style.display = "block";
        loadGroupSelectForEdit();
      }
    }
    window.switchAdminGroupTab = switchAdminGroupTab;

    async function loadGroupSelectForEdit() {
      const selectElem = document.getElementById('editGroupSelect');
      if (!selectElem) return;
      selectElem.innerHTML = "<option value=''>載入中...</option>";
      try {
        const { data, error } = await db.from('groups').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        allGroupsData = data || [];
        if (allGroupsData.length === 0) {
          selectElem.innerHTML = "<option value=''>尚無任何團務</option>";
          return;
        }
        selectElem.innerHTML = "<option value=''>-- 請選擇欲編輯的團務 --</option>";
        allGroupsData.forEach(g => {
          selectElem.innerHTML += `<option value="${g.id}">${g["團務名稱"]}</option>`;
        });
      } catch (err) {
        alert("載入團務失敗：" + err.message);
      }
    }

    function onSelectGroupToEdit() {
      let selectedId = document.getElementById('editGroupSelect').value;
      if (!selectedId) {
        clearGroupForm();
        const container = document.getElementById('productListContainer');
        if (container) container.innerHTML = "";
        return;
      }
      let group = allGroupsData.find(g => String(g.id) === String(selectedId));
      if (group) {
        document.getElementById('editingGroupId').value = group.id;
        document.getElementById('newGroupName').value = group["團務名稱"] || "";
        document.getElementById('newGroupImg').value = group["圖片"] || "";
        document.getElementById('newGroupDeadline').value = group["截單時間"] || "";
        document.getElementById('newGroupPayment').value = group["付款方式"] || "賣貨便貨到付款(不含運費)";
        document.getElementById('newGroupRemark').value = group["團務備註"] || "";
      }
      const editBox = document.getElementById('groupProductEditBox');
      if (editBox) editBox.style.display = 'block';
      if (typeof loadProductsForEdit === 'function') loadProductsForEdit(selectedId);
    }
    window.onSelectGroupToEdit = onSelectGroupToEdit;

    function clearGroupForm() {
      document.getElementById('editingGroupId').value = "";
      document.getElementById('newGroupName').value = "";
      document.getElementById('newGroupImg').value = "";
      document.getElementById('newGroupDeadline').value = "";
      document.getElementById('newGroupPayment').value = "賣貨便貨到付款(不含運費)";
      document.getElementById('newGroupRemark').value = "";
    }

    async function submitGroupForm() {
      let gName = document.getElementById('newGroupName')?.value.trim();
      let gImg = document.getElementById('newGroupImg')?.value.trim();
      let gDeadline = document.getElementById('newGroupDeadline')?.value.trim() || "未定";
      let gPayment = document.getElementById('newGroupPayment')?.value.trim() || "賣貨便貨到付款(不含運費)";
      let gRemark = document.getElementById('newGroupRemark')?.value.trim() || "";
      let msgElem = document.getElementById('createGroupMsg');
      let editingId = document.getElementById('editingGroupId')?.value;

      if (!gName) { alert("請填寫團務名稱！"); return; }
      if (msgElem) { msgElem.style.color = "#aaa"; msgElem.innerText = currentGroupMode === 'create' ? "正在建立團務..." : "正在儲存修改..."; }

      let payload = { "團務名稱": gName, "圖片": gImg, "截單時間": gDeadline, "團務備註": gRemark, "付款方式": gPayment };

      try {
        if (currentGroupMode === 'create') {
          payload["isExpired"] = false;
          const { error } = await db.from('groups').insert([payload]);
          if (error) throw error;
          alert(`✓ 成功建立團務：「${gName}」！`);
        } else {
          if (!editingId) { alert("請先選擇要編輯的團務！"); return; }
          const { error } = await db.from('groups').update(payload).eq('id', editingId);
          if (error) throw error;
          alert(`✓ 團務「${gName}」已更新成功！`);
        }
        if (msgElem) { msgElem.style.color = "#10b981"; msgElem.innerText = "✓ 操作成功！"; }
        clearGroupForm();
        if (typeof loadGroupList === 'function') await loadGroupList();
        if (currentGroupMode === 'edit') await loadGroupSelectForEdit();
      } catch (err) {
        if (msgElem) { msgElem.style.color = "#f87171"; msgElem.innerText = "操作失敗：" + err.message; }
        alert("操作失敗：" + err.message);
      }
    }
    window.submitGroupForm = submitGroupForm;
    window.submitCreateGroup = submitGroupForm;

    async function loadProductsForEdit(groupId) {
      const container = document.getElementById('productListContainer');
      if (!container) return;
      container.innerHTML = "<div style='color: #aaa; font-size: 12px; text-align: center; padding: 10px;'>載入商品中...</div>";

      try {
        const selectEl = document.getElementById('editGroupSelect');
        const groupName = selectEl ? selectEl.options[selectEl.selectedIndex].text : "";

        if (!groupName || groupName.includes("-- 請選擇")) {
          container.innerHTML = "<p style='font-size: 12px; color: #888; text-align: center; padding: 10px;'>請先選擇團務</p>";
          return;
        }

    function downloadCSV(filename, csvContent) {
      const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 📊 讀取並計算該拆團的方格看板數據
    async function loadSplitBoardData() {
      const selectEl = document.getElementById('splitGroupSelect');
      const container = document.getElementById('splitBoardTableContainer');
      const statsContainer = document.getElementById('splitSummaryStats');
      if (!selectEl || !container) return;

      const selectedGroup = selectEl.value;
      if (!selectedGroup) {
        container.innerHTML = `<p style="color: #888; text-align: center; font-size: 13px;">請先選擇一個拆團。</p>`;
        if (statsContainer) statsContainer.innerHTML = "";
        return;
      }

      container.innerHTML = `<p style="color: #aaa; text-align: center; font-size: 13px; padding: 20px;">載入喊單資料中...</p>`;

      try {
        const { data: orders, error } = await db
          .from('orders')
          .select('*')
          .eq('團務名稱', selectedGroup)
          .order('created_at', { ascending: true });

        if (error) throw error;

        if (!orders || orders.length === 0) {
          container.innerHTML = `<p style="color: #f87171; text-align: center; font-size: 13px; padding: 20px;">此團務目前沒有任何訂單。</p>`;
          if (statsContainer) statsContainer.innerHTML = "";
          return;
        }

        let roleSet = new Set();
        let roleTotals = {};
        let parsedOrders = [];

        orders.forEach(ord => {
          let rawStatus = String(ord['處理狀態'] || '').trim();
          if (rawStatus === '已取消') return;

          let items = ord['訂單內容'] || [];
          if (typeof items === 'string') { try { items = JSON.parse(items); } catch(e) { items = []; } }

          items.forEach(item => {
            let pName = item.name || item['商品名稱'] || '';
            let pQty = parseInt(item.qty || item['數量'] || 1);
            let roleName = pName.replace('[拆團款]', '').replace('[抱盒款]', '').trim();
            if (roleName.includes(' x')) roleName = roleName.split(' x')[0].trim();

            roleSet.add(roleName);
            if (!roleTotals[roleName]) roleTotals[roleName] = 0;
            roleTotals[roleName] += pQty;

            for (let i = 0; i < pQty; i++) {
              parsedOrders.push({
                buyer: ord['買家名稱'] || '未具名',
                role: roleName,
                time: new Date(ord.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                orderId: ord.id
              });
            }
          });
        });

        let roles = Array.from(roleSet);

        let statsHtml = `<div style="background: #27272a; padding: 8px 12px; border-radius: 6px;">📦 <b>總喊單統計：</b></div>`;
        roles.forEach(r => {
          let count = roleTotals[r] || 0;
          statsHtml += `<div style="background: #1e1e1e; padding: 8px 12px; border-radius: 6px; border: 1px solid #3f3f46;">🔹 ${r}: <span style="color: #38bdf8; font-weight: bold;">${count} 個</span></div>`;
        });
        if (statsContainer) statsContainer.innerHTML = statsHtml;

        let roleQueues = {};
        roles.forEach(r => { roleQueues[r] = []; });
        parsedOrders.forEach(po => {
          if (!roleQueues[po.role]) roleQueues[po.role] = [];
          roleQueues[po.role].push(po);
        });

        let maxBoxCount = 1;
        roles.forEach(r => {
          if (roleQueues[r] && roleQueues[r].length > maxBoxCount) maxBoxCount = roleQueues[r].length;
        });
        if (maxBoxCount < 4) maxBoxCount = 4;

        let tableHtml = `
          <table style="width: 100%; border-collapse: collapse; font-size: 13px; color: #e5e7eb; white-space: nowrap;">
            <thead>
              <tr style="background: #27272a; border-bottom: 2px solid #444;">
                <th style="padding: 10px; border-right: 1px solid #444; width: 100px; text-align: center; color: #38bdf8;">角色 / 款式</th>
        `;
        for (let b = 1; b <= maxBoxCount; b++) {
          tableHtml += `<th style="padding: 10px; border-right: 1px solid #444; text-align: center; min-width: 140px;">第 ${b} 盒</th>`;
        }
        tableHtml += `</tr></thead><tbody>`;

        roles.forEach(role => {
          tableHtml += `<tr style="border-bottom: 1px solid #333;">`;
          tableHtml += `<td style="padding: 10px; border-right: 1px solid #444; font-weight: bold; background: #18181b; color: #f59e0b; text-align: center;">${role}</td>`;

          let queue = roleQueues[role] || [];
          for (let b = 0; b < maxBoxCount; b++) {
            let entry = queue[b];
            let cellContent = entry ? `<div style="font-weight: bold; color: #fff;">${entry.buyer}</div><div style="font-size: 11px; color: #888;">#${entry.orderId} (${entry.time})</div>` : `<span style="color: #555; font-style: italic;">(尚無)</span>`;
            let cellBg = entry ? "#1e293b" : "transparent";
            tableHtml += `<td style="padding: 8px 10px; border-right: 1px solid #333; background: ${cellBg}; text-align: center; vertical-align: middle;">${cellContent}</td>`;
          }
          tableHtml += `</tr>`;
        });

        tableHtml += `</tbody></table>`;
        container.innerHTML = tableHtml;

      } catch (err) {
        container.innerHTML = `<p style="color: #ef4444; text-align: center; font-size: 13px; padding: 20px;">載入失敗：${err.message}</p>`;
      }
    }
    window.loadSplitBoardData = loadSplitBoardData;
  </script>
