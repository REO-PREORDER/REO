<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理員後台</title>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <style>
  /* 🛠️ 全局基本樣式 */
  body {
    background-color: #121212;
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px;
  }
  .admin-container {
    max-width: 98%;
    margin: 0 auto;
  }

  h2 {
    color: #3b82f6;
    border-bottom: 2px solid #333;
    padding-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .back-btn {
    background: #374151;
    color: #fff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
  .back-btn:hover { background: #4b5563; }
  
  /* 登入區塊 */
  #adminLoginBox {
    max-width: 400px;
    margin: 100px auto;
    background: #1e1e1e;
    padding: 30px;
    border-radius: 8px;
    border: 1px solid #333;
    text-align: center;
  }
  #adminLoginBox input {
    width: 100%;
    padding: 10px;
    margin: 15px 0;
    background: #2d2d2d;
    border: 1px solid #444;
    color: #fff;
    border-radius: 6px;
    box-sizing: border-box;
  }
  #adminLoginBox button {
    width: 100%;
    padding: 10px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  #adminLoginBox button:hover { background: #1d4ed8; }

  /* 📊 後台表單與卡片整體美化 */
  .admin-container form, 
  .admin-container div[style*="margin: 15px"] {
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    margin-bottom: 20px;
  }

  /* 輸入框與文字區域美化 */
  .admin-container input[type="text"],
  .admin-container input[type="url"],
  .admin-container textarea,
  .admin-container select {
    width: 100%;
    background: #27272a;
    border: 1px solid #3f3f46;
    border-radius: 8px;
    color: #ffffff;
    padding: 10px 14px;
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 16px;
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .admin-container input:focus,
  .admin-container textarea:focus,
  .admin-container select:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }

  /* 標籤文字 */
  .admin-container label, 
  .admin-container span {
    font-size: 13px;
    color: #d4d4d8;
    font-weight: 500;
  }

  /* 一般送出與操作按鈕美化 */
  .admin-container button[type="submit"],
  .admin-container button:not(.back-btn):not([id^="btn-"]) {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: bold;
    width: 100%;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
    margin-top: 10px;
  }

  .admin-container button[type="submit"]:hover,
  .admin-container button:not(.back-btn):not([id^="btn-"]):hover {
    opacity: 0.9;
  }

  /* 分頁內容與表格樣式 */
  .admin-tab-content { display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; color: #e5e7eb; }
  th, td { padding: 10px 12px; border-bottom: 1px solid #333; text-align: left; }
  th { background: #2d2d2d; color: #9ca3af; }
</style>
</head>
<body>

  <script>
  let currentGroupMode = "create"; // 'create' 或 'edit'
let allGroupsData = []; // 暫存所有團務原始資料
    
// 🚀 建立新團務或儲存編輯內容
async function submitGroupForm() {
  const editingIdInput = document.getElementById('editingGroupId');
  const groupNameInput = document.getElementById('newGroupName');
  const groupImgInput = document.getElementById('newGroupImg');
  const deadlineInput = document.getElementById('newGroupDeadline');
  const paymentInput = document.getElementById('newGroupPayment');
  const remarkInput = document.getElementById('newGroupRemark');
  const batchInput = document.getElementById('batchProductsInput'); // 批次商品輸入框

  const editingId = editingIdInput ? editingIdInput.value.trim() : "";
  const isEditMode = Boolean(editingId);

  const groupName = groupNameInput ? groupNameInput.value.trim() : "";
  const groupImg = groupImgInput ? groupImgInput.value.trim() : "";
  const deadline = deadlineInput ? deadlineInput.value.trim() : "";
  const payment = paymentInput ? paymentInput.value.trim() : "賣貨便貨到付款(不含運費)";
  const remark = remarkInput ? remarkInput.value.trim() : "";
  const batchText = batchInput ? batchInput.value.trim() : "";

  // 1. 檢查基本欄位
  if (!groupName) {
    alert("請填寫團務名稱！");
    if (groupNameInput) groupNameInput.focus();
    return;
  }

  // 2. 只有在「新增模式」下，才強制要求必須填寫批次商品
  if (!isEditMode && !batchText) {
    alert("「批次貼上新增商品」欄位填入至少一項商品，才能建立新團務！");
    if (batchInput) batchInput.focus();
    return;
  }

  try {
    if (isEditMode) {
      // 📝 編輯模式：更新現有 groups 資料
      const { error: updateErr } = await db
        .from('groups')
        .update({
          "團務名稱": groupName,
          "圖片": groupImg,
          "截單時間": deadline,
          "付款方式": payment,
          "團務備註": remark
        })
        .eq('id', Number(editingId));

      if (updateErr) throw updateErr;

      alert(`💾 成功儲存團務「${groupName}」的修改內容！`);
      location.reload();

    } else {
      // ➕ 新增模式：寫入新 groups 資料
      const { data: newGroup, error: groupErr } = await db
        .from('groups')
        .insert([{
          "團務名稱": groupName,
          "圖片": groupImg,
          "截單時間": deadline,
          "付款方式": payment,
          "團務備註": remark,
          "isExpired": false
        }])
        .select();

      if (groupErr) throw groupErr;

      // 解析批次商品
      let lines = batchText.split('\n');
      let newProducts = [];

      for (let line of lines) {
        line = line.trim();
        if (!line) continue;
        let parts = line.includes('\t') ? line.split('\t') : line.split(/\s+/);
        parts = parts.map(p => p.trim()).filter(p => p !== "");

        if (parts.length >= 3) {
          let pCat = parts[0] || "一般";
          let pName = parts[1] || "";
          let pPrice = parseFloat(parts[2]) || 0;
          let pImg = parts[3] || "";
          let pDesc = parts.slice(4).join(" ");

          if (pName && !isNaN(pPrice)) {
            newProducts.push({
              "團務名稱": groupName,
              "商品分類": pCat,
              "商品名稱": pName,
              "單價": pPrice,
              "圖片": pImg,
              "商品說明": pDesc,
              "isExpired": false
            });
          }
        }
      }

      if (newProducts.length === 0) {
        alert("❌ 格式有誤！批次商品至少需要包含「分類、名稱、單價」，請檢查後再試一次。");
        return;
      }

      // 批次寫入 products 資料表
      const { error: prodErr } = await db.from('products').insert(newProducts);
      if (prodErr) throw new Error("團務建立成功，但商品寫入失敗：" + prodErr.message);

      alert(`🎉 成功建立新團務「${groupName}」並同時新增了 ${newProducts.length} 項商品！`);
      location.reload();
    }

  } catch (err) {
    console.error("操作失敗：", err);
    alert("❌ 操作失敗：" + err.message);
  }

// --- 載入團務管理列表（依截單時間近到遠排序） ---
let cachedGroupsList = [];
async function loadGroupManageList() {
    try {
        const [groupsRes, ordersRes] = await Promise.all([
            db.from('groups').select('*'),
            db.from('orders').select('團務名稱, 處理狀態')
        ]);
        
        if (groupsRes.error) throw groupsRes.error;
        let groups = groupsRes.data || [];
        let orders = ordersRes.data || [];

        // 計算各團務有效訂單數
        let orderCounts = {};
        orders.forEach(o => {
            if (o['處理狀態'] !== '已取消') {
                let gName = o['團務名稱'] || '未分類';
                orderCounts[gName] = (orderCounts[gName] || 0) + 1;
            }
        });

        // ⏱️ 依照截單時間由近到遠排序 (時間越近越前面，沒填的排後面)
        groups.sort((a, b) => {
            let timeA = a['截單時間'] ? new Date(a['截單時間']).getTime() : 8640000000000;
            let timeB = b['截單時間'] ? new Date(b['截單時間']).getTime() : 8640000000000;
            return timeA - timeB;
        });

        cachedGroupsList = groups.map(g => ({
            ...g,
            orderCount: orderCounts[g['團務名稱']] || 0
        }));

        renderGroupManageTable();
    } catch (err) {
        console.error("載入團務列表失敗：", err);
    }
}

// 簡易 CSV 匯出輔助函式 (如果你的後台原本就有共用的 export 函式可忽略這段)
function exportToCSV(dataArray, filename) {
    if (!dataArray.length) return;
    let keys = Object.keys(dataArray[0]);
    let csvContent = "\uFEFF" + keys.join(",") + "\n"; // 加 BOM 避免中文亂碼
    
    dataArray.forEach(row => {
        let values = keys.map(k => {
            let val = row[k] !== null && row[k] !== undefined ? String(row[k]) : "";
            return `"${val.replace(/"/g, '""')}"`;
        });
        csvContent += values.join(",") + "\n";
    });

    let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
}

// 統計總表 CSV 匯出邏輯
async function exportSummaryCSV(groupName, orders) {
    // 抓取該團對應的商品資料來統計
    let summary = {};
    orders.forEach(o => {
        if (o['處理狀態'] === '已取消') return;
        let items = typeof o['商品明細'] === 'string' ? JSON.parse(o['商品明細'] || '{}') : (o['商品明細'] || {});
        for (let [prodName, qty] of Object.entries(items)) {
            summary[prodName] = (summary[prodName] || 0) + Number(qty);
        }
    });

    let summaryArray = Object.keys(summary).map(pName => ({
        '商品名稱': pName,
        '總訂購數量': summary[pName]
    }));

    if (summaryArray.length === 0) {
        alert("此團無有效的商品明細可統計");
        return;
    }

    exportToCSV(summaryArray, `${groupName}_商品統計總表.csv`);
}

async function exportProductSummaryCSV() {
  const selectEl = document.getElementById('exportGroupSelect');
  const selectedGroup = selectEl ? selectEl.value.replace(/\r?\n|\r/g, '').trim() : "ALL";

  // 🔍 點下去時印出你選了什麼
  console.log("【除錯】目前下拉選單選中的團務:", JSON.stringify(selectedGroup));

  try {
    const { data: allOrders, error } = await db.from('orders').select('*');
    if (error || !allOrders || allOrders.length === 0) {
      alert("目前 orders 資料表中沒有任何訂單！");
      return;
    }

    const summaryMap = {};
    let validCount = 0;

    allOrders.forEach(ord => {
      const rawStatus = String(ord.status || ord['處理狀態'] || '').trim();
      if (rawStatus === '已取消' || rawStatus === '待確認' || rawStatus === '') return;

      // 抓出訂單上的團務名稱
      const groupName = String(ord['團務名稱'] || ord.group_name || ord['團名'] || '未分類團務').replace(/\r?\n|\r/g, '').trim();
      
      // 🔍 每一筆訂單比對時印出來看
      console.log(`【除錯】訂單ID: ${ord.id} | 讀到的團名: ${JSON.stringify(groupName)} | 是否符合選擇: ${groupName === selectedGroup}`);

      if (selectedGroup !== "ALL" && groupName !== selectedGroup) return;

      validCount++;

      let itemsList = ord['訂單內容'] || ord.items || ord['商品列表'] || [];
      if (typeof itemsList === 'string') {
        try { itemsList = JSON.parse(itemsList); } catch(e) { itemsList = []; }
      }

      if (Array.isArray(itemsList)) {
        itemsList.forEach(item => {
          const pName = item.name || item['商品名稱'] || '未知商品';
          const pPrice = Number(item.price || item['單價'] || 0);
          const pQty = Number(item.qty || item['數量'] || 1);

          const key = `${groupName}__${pName}`;

          if (!summaryMap[key]) {
            summaryMap[key] = { group: groupName, name: pName, price: pPrice, totalQty: 0 };
          }
          summaryMap[key].totalQty += pQty;
        });
      }
    });

    if (validCount === 0) {
      alert(`找不到「${selectedGroup}」的有效訂單！`);
      return;
    }

    const sortedSummary = Object.values(summaryMap).sort((a, b) => {
      if (a.group !== b.group) return a.group.localeCompare(b.group);
      return a.name.localeCompare(b.name);
    });

    let csv = "團務名稱,商品名稱,單價,總預購數量,預估總金額\n";

    sortedSummary.forEach(item => {
      const gName = `"${item.group.replace(/"/g, '""')}"`;
      const pName = `"${item.name.replace(/"/g, '""')}"`;
      const totalPrice = item.price * item.totalQty;

      csv += `${gName},${pName},${item.price},${item.totalQty},${totalPrice}\n`;
    });

    const today = new Date().toISOString().split('T')[0];
    const fileName = selectedGroup === "ALL" ? `商品採購總數表_全部團務_${today}.csv` : `商品採購總數表_${selectedGroup}_${today}.csv`;
    downloadCSV(fileName, csv);
  } catch (err) {
    console.error("匯出失敗：", err);
    alert("匯出採購統計失敗：" + err.message);
  }
}
    // 轉換 Google 雲端硬碟網址為直接顯示圖片格式
  function formatImageUrl(url) {
    if (!url) return "";
    url = url.trim();
    let match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) {
      return `https://lh3.googleusercontent.com/d/${match[1]}`;
    }
    let matchUc = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (matchUc && matchUc[1]) {
      return `https://lh3.googleusercontent.com/d/${matchUc[1]}`;
    }
    return url;
  }

  async function submitBatchProducts() {
  try {
    // 1. 改用正確的下拉選單 id: editGroupSelect
    let groupSelect = document.getElementById('editGroupSelect');
    if (!groupSelect) {
      alert("找不到群組選擇元件 (editGroupSelect)");
      return;
    }
    
    let selectedId = groupSelect.value;
    if (!selectedId) {
      alert("請先選擇團務！");
      return;
    }

    // 取得選中的團務名稱（從 allGroupsData 裡面找到對應的團務名稱）
    let group = allGroupsData ? allGroupsData.find(g => String(g.id) === String(selectedId)) : null;
    let targetGroup = group ? group["團務名稱"] : document.getElementById('newGroupName').value;

    if (!targetGroup) {
      alert("無法取得目前的團務名稱，請確認是否已選擇團務！");
      return;
    }

    // 2. 檢查輸入框
    let inputElem = document.getElementById('batchProductsInput');
    if (!inputElem) {
      alert("找不到輸入框元件 (batchProductsInput)");
      return;
    }
    let rawText = inputElem.value.trim();
    if (!rawText) {
      alert("請輸入要新增的商品資料！");
      return;
    }

    let msgElem = document.getElementById('batchMsg');
    if (msgElem) {
      msgElem.style.color = "#aaa";
      msgElem.innerText = "正在解析並新增商品...";
    }

    // 3. 處理文字與換行（支援從試算表複製過來的 Tab 與多行格式）
    let lines = rawText.split('\n');
    let newProducts = [];

    for (let line of lines) {
      line = line.trim();
      if (!line) continue;

      let parts = line.includes('\t') ? line.split('\t') : line.split(/\s+/);
      parts = parts.map(p => p.trim()).filter(p => p !== "");

      if (parts.length >= 3) {
        let pCat = parts[0] || "一般";
        let pName = parts[1] || "";
        let pPrice = parseFloat(parts[2]) || 0;
        let pImg = parts[3] || "";
        let pDesc = parts.slice(4).join(" ");

        // 修正 Google 雲端硬碟或其他網址內的空格問題
        pImg = pImg.replace(/(\?|\&)\s+/g, '$1');

        if (pName && !isNaN(pPrice)) {
          newProducts.push({
            "團務名稱": targetGroup,
            "商品分類": pCat,
            "商品名稱": pName,
            "單價": pPrice,
            "圖片": typeof formatImageUrl === 'function' ? formatImageUrl(pImg) : pImg,
            "商品說明": pDesc,
            "isExpired": false
          });
        }
      }
    }

    if (newProducts.length === 0) {
      if (msgElem) {
        msgElem.style.color = "#f87171";
        msgElem.innerText = "解析失敗！沒有成功抓到任何商品（請確認順序：分類, 名稱, 單價）。";
      } else {
        alert("解析失敗！沒有成功抓到任何商品。");
      }
      return;
    }

    // 4. 寫入 Supabase 資料庫
    if (typeof db === 'undefined') {
      alert("資料庫物件 (db) 未定義！");
      return;
    }

    const { error } = await db.from('products').insert(newProducts);
    if (error) throw error;
    
    if (msgElem) {
      msgElem.style.color = "#10b981";
      msgElem.innerText = `✓ 成功批次新增 ${newProducts.length} 項商品！`;
    } else {
      alert(`✓ 成功批次新增 ${newProducts.length} 項商品！`);
    }

    inputElem.value = "";
    
    // 重新載入該團務的商品列表
    if (typeof loadProductsForEdit === 'function') {
      loadProductsForEdit(selectedId);
    }

  } catch (err) {
    console.error(err);
    alert("批次新增發生錯誤：" + err.message);
  }
}

// 切換按鈕樣式並載入資料
function switchOrderRecordTab(status) {
  currentRecordStatus = status;

  // 切換按鈕 Active 樣式
  let btnConfirmed = document.getElementById('btnConfirmedOrders');
  let btnCancelled = document.getElementById('btnCancelledOrders');

  if (btnConfirmed && btnCancelled) {
    if (status === '已成立') {
      btnConfirmed.classList.add('active');
      btnCancelled.classList.remove('active');
    } else {
      btnCancelled.classList.add('active');
      btnConfirmed.classList.remove('active');
    }
  }

  loadAllOrders(status);
}
window.switchOrderRecordTab = switchOrderRecordTab;

// 📦 載入所有訂單紀錄（已強化資料結構相容性）
async function loadAllOrders() {
  const tbody = document.getElementById('allOrdersTbody');
  if (!tbody) return;
  
  tbody.innerHTML = "<tr><td colspan='10' style='text-align:center; padding:15px; color:#888;'>載入訂單中...</td></tr>";

  try {
    const res = await db.from('orders').select('*').order('created_at', { ascending: false });

    if (res.error) throw res.error;

    // 💡 智慧相容：不管資料是被包在 res.data 還是直接回傳陣列，都能正確抓到！
    let ordersData = [];
    if (Array.isArray(res)) {
      ordersData = res;
    } else if (res && Array.isArray(res.data)) {
      ordersData = res.data;
    } else if (res && res.success && Array.isArray(res.data)) {
      ordersData = res.data;
    }

    window.allOrdersData = ordersData;
    console.log("成功解析的訂單資料陣列：", window.allOrdersData);

    // 呼叫渲染表格
    if (typeof renderOrdersTable === 'function') {
      renderOrdersTable(window.allOrdersData);
    } else {
      console.warn("renderOrdersTable 函式尚未定義！");
    }
    
    if (typeof updateFilterGroupOptions === 'function') {
      updateFilterGroupOptions(window.allOrdersData);
    }

  } catch (err) {
    console.error("載入訂單失敗：", err);
    tbody.innerHTML = `<tr><td colspan='10' style='text-align:center; padding:15px; color:#f87171;'>載入失敗：${err.message}</td></tr>`;
  }
}
window.loadAllOrders = loadAllOrders;

// 🎨 渲染訂單表格（已加強 DOM 可見性與防護）
function renderOrdersTable(orders) {
  // 💡 強制確保訂單分頁容器是顯示的，避免因為 display: none 導致渲染失敗
  const tabOrders = document.getElementById('tab-orders');
  if (tabOrders) {
    tabOrders.style.display = 'block';
  }

  const tbody = document.getElementById('allOrdersTbody');
  if (!tbody) {
    console.error("找不到 #allOrdersTbody 元素！");
    return;
  }

  if (!orders || orders.length === 0) {
    tbody.innerHTML = "<tr><td colspan='10' style='text-align:center; padding:15px; color:#888;'>目前沒有任何訂單紀錄</td></tr>";
    return;
  }

  let html = "";
  orders.forEach(o => {
    let orderId = o.id || ""; 
    let timeStr = o.created_at ? new Date(o.created_at).toLocaleString() : "未知時間";
    
    let buyerRemark = o["買家備註"] || "-";
    let adminRemark = o["備註"] || "-";
    
    let statusColor = "#10b981"; 
    if (o["處理狀態"] === "已變更") statusColor = "#f59e0b";
    if (o["處理狀態"] === "已取消") statusColor = "#ef4444";

    let detailsText = "";
    let items = o["訂單內容"];
    if (typeof items === "string") {
      try { items = JSON.parse(items); } catch (e) {}
    }
    
    if (Array.isArray(items)) {
  detailsText = items.map(i => {
    let cat = i.category ? `[${i.category}] ` : "";
    return `${cat}${i.name || i["商品名稱"]} x ${i.qty || i["數量"]} ($${i.price || 0})`;
  }).join("<br>");
} else {
      detailsText = items || "無明細";
    }

    html += `
      <tr style="border-bottom: 1px solid #333;">
        <td style="padding: 8px; color: #38bdf8; font-weight: bold;">#${orderId}</td>
        <td style="padding: 8px; color: #aaa;">${timeStr}</td>
        <td style="padding: 8px; color: #fff; font-weight: bold;">${o["買家名稱"] || '未填寫'}</td>
        <td style="padding: 8px; color: #60a5fa;">${o["團務名稱"] || '-'}</td>
        <td style="padding: 8px; color: #ddd; line-height: 1.4; font-size: 11px;">${detailsText}</td>
        <td style="padding: 8px; color: #f87171; font-weight: bold;">$${o["總金額"] || 0}</td>

        </td>

  tbody.innerHTML = html;

}

// 🔍 搜尋與篩選訂單
function filterOrders() {
  const keyword = document.getElementById('searchOrderInput').value.trim().toLowerCase();
  const selectedGroup = document.getElementById('filterGroupSelect').value;
  const selectedStatus = document.getElementById('filterStatusSelect') ? document.getElementById('filterStatusSelect').value : ""; // 💡 取得選中的狀態

  if (!window.allOrdersData) return;

  let filtered = window.allOrdersData.filter(o => {
    let orderIdStr = o.id ? String(o.id).trim() : ""; 
    
    // 1. 先獨立檢查：如果輸入了關鍵字，是否剛好等於訂單編號
    let matchId = keyword && (orderIdStr === keyword);

    // 2. 檢查其他文字欄位是否包含關鍵字
    let matchOther = keyword && (
      (o["買家名稱"] && o["買家名稱"].toLowerCase().includes(keyword)) ||
      (o["手機號碼"] && o["手機號碼"].toLowerCase().includes(keyword)) ||
      (o["Email"] && o["Email"].toLowerCase().includes(keyword))
    );

    // 3. 綜合判定：如果沒有輸入關鍵字，或者「剛好符合編號」或「其他欄位包含關鍵字」
    let matchKeyword = !keyword || matchId || matchOther;

    let matchGroup = !selectedGroup || o["團務名稱"] === selectedGroup;

    // 💡 檢查訂單狀態是否符合（若沒選代表全部，若有選則必須完全相符，沒填狀態的預設視為「待確認」）
    const currentStatus = String(o["處理狀態"] || '待確認').trim();
    let matchStatus = !selectedStatus || currentStatus === selectedStatus;

    return matchKeyword && matchGroup && matchStatus;
  });

  renderOrdersTable(filtered);
}
window.filterOrders = filterOrders;

  let html = '<option value="">所有團務</option>';
  groups.forEach(g => {

  });
  select.innerHTML = html;
  select.value = currentVal;

  function openModifyModal(order) {
    let orderId = order.id;
    let modalBg = document.createElement('div');
    modalBg.style.cssText = "position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000;";
    
    let modalBox = document.createElement('div');
    modalBox.style.cssText = "background: #1e1e1e; padding: 20px; border-radius: 10px; width: 95%; max-width: 500px; color: #fff; font-size: 13px; max-height: 90vh; overflow-y: auto;";
    
    let itemsHtml = "";
    (order["訂單內容"] || []).forEach((item, idx) => {
        itemsHtml += `
            <div style="background: #2a2a2a; padding: 10px; border-radius: 6px; margin-bottom: 8px;" class="modify-item-row" data-index="${idx}">
                <div style="font-weight: bold; margin-bottom: 4px;">${item.name}</div>
                <div style="display: flex; gap: 10px;">
                    <div>
                        單價：<input type="number" class="item-price" value="${item.price}" style="width: 80px; padding: 4px; background: #121212; border: 1px solid #444; color: #fff; border-radius: 4px;">
                    </div>
                    <div>
                        數量：<input type="number" class="item-qty" value="${item.qty}" min="0" style="width: 60px; padding: 4px; background: #121212; border: 1px solid #444; color: #fff; border-radius: 4px;">
                    </div>
                </div>
            </div>
        `;
    });

    modalBox.innerHTML = `
        <h3 style="margin-bottom: 12px; text-align: center;">修改訂單內容 (${order["買家名稱"]})</h3>
        <div id="modifyItemsContainer">${itemsHtml}</div>
        <div style="margin: 15px 0; font-size: 15px; font-weight: bold; text-align: right; color: #60a5fa;" id="modalTotalPrice">
            新總金額：$${order["總金額"]}
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button id="saveModifyBtn" style="background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">儲存變更</button>
            <button id="closeModifyBtn" style="background: #555; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">取消</button>
        </div>
    `;

    modalBg.appendChild(modalBox);
    document.body.appendChild(modalBg);

    const calculateTotal = () => {
        let total = 0;
        let rows = modalBox.querySelectorAll('.modify-item-row');
        rows.forEach(row => {
            let price = parseFloat(row.querySelector('.item-price').value) || 0;
            let qty = parseInt(row.querySelector('.item-qty').value) || 0;
            total += price * qty;
        });
        modalBox.querySelector('#modalTotalPrice').innerText = `新總金額：$${total}`;
        return total;
    };

    modalBox.querySelectorAll('.item-price, .item-qty').forEach(input => {
        input.addEventListener('input', calculateTotal);
    });

    modalBox.querySelector('#closeModifyBtn').onclick = () => {
        document.body.removeChild(modalBg);
    };

    modalBox.querySelector('#saveModifyBtn').onclick = async () => {
        let newItems = [];
        let rows = modalBox.querySelectorAll('.modify-item-row');

        rows.forEach(row => {
            let idx = row.getAttribute('data-index');
            let origItem = order["訂單內容"][idx];
            let price = parseFloat(row.querySelector('.item-price').value);
            let qty = parseInt(row.querySelector('.item-qty').value);

            if (qty > 0) {
                newItems.push({
                    ...origItem,
                    price: price,
                    qty: qty
                });
            }
        });

        if (newItems.length === 0) {
            alert("訂單內至少需保留一項商品！");
            return;
        }

        let newTotal = calculateTotal();
        let changeReason = prompt("請輸入變更訂單的原因或備註說明（選填）：", "商品數量/價格調整") || "無";

        if (!confirm(`確定要儲存變更嗎？\n新總金額將改為：$${newTotal}`)) return;

        try {
            const { error } = await db.from('orders').update({
                "訂單內容": newItems,
                "總金額": newTotal,
                "處理狀態": "已變更"
            }).eq('id', orderId);

            if (error) throw error;

            let paymentMethod = "事先匯款";
            const { data: groupData, error: groupError } = await db.from('groups').select('*').eq('團務名稱', order["團務名稱"]).single();
            if (!groupError && groupData && groupData["付款方式"]) {
                paymentMethod = groupData["付款方式"];
            }

            let productText = newItems.map(i => `${i.name} x ${i.qty} ($${i.price} / 小計: $${i.price * i.qty})`).join("\n");

            if (typeof sendPreOrderEmail === 'function') {
                try {
                    await sendPreOrderEmail({
                        customerEmail: order["Email"], 
                        subject: `【REO代購】${order["團務名稱"]} 訂單修改通知`, // 👈 加上這行主旨
                        lineName: order["買家名稱"],              
                        groupName: order["團務名稱"],             
                        productDetails: productText,        
                        totalPrice: newTotal,              
                        paymentMethod: paymentMethod, 
                        status: "已變更",                            
                        changeReason: changeReason,
                       orderId: orderId
                    });
                } catch (emailErr) {
                    console.error("【寄信失敗完整物件】", emailErr);
                    let errMsg = emailErr.message || emailErr.error || JSON.stringify(emailErr, null, 2);
                    alert("訂單已更新，但通知信發送失敗：" + errMsg);
                }
            }

            alert("訂單已成功修改、更新並已發送通知信！");
            document.body.removeChild(modalBg);
            loadAllOrders();
            loadPendingOrders();
        } catch (err) {
            alert("更新失敗：" + err.message);
        }
    }

// 1. 載入含有拆團款的團務選單
async function loadSplitGroupOptions() {
  const selectElem = document.getElementById('splitGroupSelect');
  if (!selectElem) return;
  
  try {
    const [groupsRes, productsRes] = await Promise.all([
      db.from('groups').select('*').order('created_at', { ascending: false }),
      db.from('products').select('*').order('id', { ascending: false }).range(0, 4999)
    ]);

    if (groupsRes.error) throw groupsRes.error;
    if (productsRes.error) throw productsRes.error;

    const groups = groupsRes.data || [];
    const products = productsRes.data || [];

    const cleanStr = (str) => String(str || '').replace(/[\s\u3000]+/g, '').trim();

    let validGroupNames = new Set();
    products.forEach(p => {
      let pCat = cleanStr(p['商品分類']);
      let gName = String(p['團務名稱'] || '').trim();
      if (pCat.includes('拆') && gName) {
        validGroupNames.add(gName);
      }
    });

    let html = `<option value="">-- 請選擇要檢視的拆團 --</option>`;
    let count = 0;

    groups.forEach(g => {
      const gName = String(g["團務名稱"] || '').trim();
      if (gName && validGroupNames.has(gName)) {
        html += `<option value="${gName}">${gName}</option>`;
        count++;
      }
    });

    if (count === 0) {
      html = `<option value="">-- 目前沒有包含拆團款的團務 --</option>`;
    }

    selectElem.innerHTML = html;
  } catch (err) {
    console.error("載入團務下拉選單失敗：", err);
  }
}

// 2. 當選擇團務後，載入該團務底下「只包含拆團款」的商品分類
async function loadCategoriesByGroup(groupName) {
  const catSelect = document.getElementById('splitCategorySelect');
  if (!catSelect) return;

  if (!groupName) {
    catSelect.innerHTML = `<option value="">-- 請先選擇團務 --</option>`;
    return;
  }

  try {
    const { data: products, error } = await db.from('products')
      .select('商品分類, 團務名稱')
      .eq('團務名稱', groupName)
      .range(0, 4999);

    if (error) throw error;

    let categories = new Set();
    (products || []).forEach(p => {
      let cat = String(p['商品分類'] || '').trim();
      // 只保留包含「拆」字的分類
      if (cat && cat.includes('拆')) {
        categories.add(cat);
      }
    });

    let html = `<option value="">-- 請選擇商品分類 --</option>`;
    categories.forEach(cat => {
      html += `<option value="${cat}">${cat}</option>`;
    });

    if (categories.size === 0) {
      html = `<option value="">-- 該團務無拆團款分類 --</option>`;
    }

    catSelect.innerHTML = html;
  } catch (err) {
    console.error("載入分類失敗：", err);
    catSelect.innerHTML = `<option value="">-- 載入分類失敗 --</option>`;
  }
}

  if (selectElem) {
    selectElem.addEventListener('change', (e) => {

// 📊 讀取並計算該拆團指定分類的方格看板數據
async function loadSplitBoardData() {
  const groupSelect = document.getElementById('splitGroupSelect');
  const catSelect = document.getElementById('splitCategorySelect');
  const container = document.getElementById('splitBoardTableContainer');
  const statsContainer = document.getElementById('splitSummaryStats');
  
  if (!groupSelect || !catSelect || !container) return;

  const selectedGroup = groupSelect.value;
  const selectedCategory = catSelect.value;

  if (!selectedGroup) {
    container.innerHTML = `<p style="color: #888; text-align: center; font-size: 13px;">請先選擇一個團務。</p>`;
    if (statsContainer) statsContainer.innerHTML = "";
    return;
  }
  if (!selectedCategory) {
    container.innerHTML = `<p style="color: #888; text-align: center; font-size: 13px;">請選擇商品分類。</p>`;
    if (statsContainer) statsContainer.innerHTML = "";
    return;
  }

  container.innerHTML = `<p style="color: #aaa; text-align: center; font-size: 13px; padding: 20px;">載入喊單資料中...</p>`;

  try {
    // 1. 先從 products 撈出該團務的所有商品，並按 id 由小到大排序
    const { data: prodData, error: prodErr } = await db
      .from('products')
      .select('*')
      .eq('團務名稱', selectedGroup)
      .order('id', { ascending: true });

    if (prodErr) throw prodErr;

    // 2. 萃取出該分類底下的所有角色清單 (roles)
    let roles = [];
    (prodData || []).forEach(p => {
      let pName = p['商品名稱'] || '';
      let pCat = String(p['商品分類'] || '').trim();

      // 如果商品分類或名稱符合目前選取的分類
      if (pCat === selectedCategory || pName.includes(selectedCategory)) {
        if (pCat.includes('抱盒款') || pName.includes('[抱盒款]')) return;

        let roleName = pName
          .replace(/\[拆團款(-[^\]]+)?\]/g, '')
          .replace(/\[抱盒款(-[^\]]+)?\]/g, '')
          .trim();
        if (roleName.includes(' x')) roleName = roleName.split(' x')[0].trim();

        if (roleName && !roles.includes(roleName)) {
          roles.push(roleName);
        }
      }
    });

    if (roles.length === 0) {
      container.innerHTML = `<p style="color: #f87171; text-align: center; font-size: 13px; padding: 20px;">此分類目前沒有設定任何商品或角色。</p>`;
      if (statsContainer) statsContainer.innerHTML = "";
      return;
    }

    // 3. 撈取訂單
    const { data: orders, error: ordErr } = await db
      .from('orders')
      .select('*')
      .eq('團務名稱', selectedGroup)
      .order('created_at', { ascending: true });

    if (ordErr) throw ordErr;

    if (!orders || orders.length === 0) {
      container.innerHTML = `<p style="color: #f87171; text-align: center; font-size: 13px; padding: 20px;">此團務目前沒有任何訂單。</p>`;
      if (statsContainer) statsContainer.innerHTML = "";
      return;
    }

    let roleSet = new Set();
    let roleTotals = {};
    let validOrders = [];

    // 4. 正確解析訂單內容：直接從訂單商品名稱中檢查分類與角色
    orders.forEach(ord => {
      let rawStatus = String(ord['處理狀態'] || '').trim();
      if (rawStatus === '已取消') return;

      let items = ord['訂單內容'] || [];
      if (typeof items === 'string') { try { items = JSON.parse(items); } catch(e) { items = []; } }

      let orderItemsParsed = [];
      items.forEach(item => {
        let pName = item.name || item['商品名稱'] || '';
        
        // 排除抱盒款
        if (pName.includes('[抱盒款]')) return;

        // 關鍵檢查：這項商品的名稱必須包含你目前在下拉選單選取的分類
        if (!pName.includes(selectedCategory)) return;

        // 萃取角色名稱
        let roleName = pName
          .replace(/\[拆團款(-[^\]]+)?\]/g, '')
          .replace(/\[抱盒款(-[^\]]+)?\]/g, '')
          .trim();
        
        if (roleName.includes(' x')) roleName = roleName.split(' x')[0].trim();

        if (!roles.includes(roleName)) return;

        let pQty = parseInt(item.qty || item['數量'] || 1);

        roleSet.add(roleName);
        if (!roleTotals[roleName]) roleTotals[roleName] = 0;
        roleTotals[roleName] += pQty;

        for (let i = 0; i < pQty; i++) {
          orderItemsParsed.push(roleName);
        }
      });

      if (orderItemsParsed.length > 0) {
        validOrders.push({
          buyer: ord['買家名稱'] || '未具名',
          time: new Date(ord.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          orderId: ord.id,
          items: orderItemsParsed
        });
      }
    });
  
    if (roles.length === 0 || validOrders.length === 0) {
      container.innerHTML = `<p style="color: #f87171; text-align: center; font-size: 13px; padding: 20px;">此分類目前沒有包含喊單紀錄。</p>`;
      if (statsContainer) statsContainer.innerHTML = "";
      return;
    }

    // 4. 渲染上方統計摘要
    let statsHtml = `<div style="background: #27272a; padding: 6px 10px; border-radius: 6px; color: #fff;">📦 <b>總喊單統計：</b></div>`;
    roles.forEach(r => {
      let count = roleTotals[r] || 0;
      statsHtml += `<div style="background: #1e1e1e; padding: 6px 10px; border-radius: 6px; border: 1px solid #3f3f46; color: #fff;">🔹 ${r}: <span style="color: #38bdf8; font-weight: bold;">${count} 個</span></div>`;
    });
    if (statsContainer) statsContainer.innerHTML = statsHtml;

    // 5. 分盒邏輯
    let boxes = [];
    let individualItems = [];
    
    validOrders.sort((a, b) => new Date(a.time) - new Date(b.time));

    validOrders.forEach(ord => {
      ord.items.forEach(roleName => {
        individualItems.push({
          buyer: ord.buyer,
          time: ord.time,
          orderId: ord.orderId,
          role: roleName
        });
      });
    });

    individualItems.forEach(item => {
      let placed = false;
      for (let bIndex = 0; bIndex < boxes.length; bIndex++) {
        let currentBox = boxes[bIndex];
        if (!currentBox[item.role]) currentBox[item.role] = [];

        if (currentBox[item.role].length === 0) {
          currentBox[item.role].push({ buyer: item.buyer, time: item.time, orderId: item.orderId });
          placed = true;
          break;
        }
      }

      if (!placed) {
        let newBox = {};
        roles.forEach(r => { newBox[r] = []; });
        newBox[item.role].push({ buyer: item.buyer, time: item.time, orderId: item.orderId });
        boxes.push(newBox);
      }
    });

    let maxBoxCount = Math.max(boxes.length, 4);

    // 6. 組合表格 HTML
    let tableHtml = `
      <table style="width: 100%; border-collapse: collapse; font-size: 13px; color: #e5e7eb; white-space: nowrap;">
        <thead>
          <tr style="background: #27272a; border-bottom: 2px solid #444;">
            <th style="padding: 10px; border-right: 1px solid #444; width: 100px; text-align: center; color: #38bdf8;">${selectedCategory} / 角色</th>
    `;
    for (let b = 1; b <= maxBoxCount; b++) {
      tableHtml += `<th style="padding: 10px; border-right: 1px solid #444; text-align: center; min-width: 140px;">第 ${b} 盒</th>`;
    }
    tableHtml += `</tr></thead><tbody>`;

    roles.forEach(role => {
      tableHtml += `<tr style="border-bottom: 1px solid #333;">`;
      tableHtml += `<td style="padding: 10px; border-right: 1px solid #444; font-weight: bold; background: #18181b; color: #f59e0b; text-align: center;">${role}</td>`;

      for (let b = 0; b < maxBoxCount; b++) {
        let boxData = boxes[b] ? boxes[b][role] : null;
        let entry = (boxData && boxData.length > 0) ? boxData[0] : null;

        let cellContent = entry ? `<div style="font-weight: bold; color: #fff;">${entry.buyer} <span style="color: #38bdf8; font-size: 11px;">(#${entry.orderId})</span></div><div style="font-size: 11px; color: #888;">(${entry.time})</div>` : `<span style="color: #555; font-style: italic;">(尚無)</span>`;
        let cellBg = entry ? "#1e293b" : "transparent";
        tableHtml += `<td style="padding: 8px 10px; border-right: 1px solid #333; background: ${cellBg}; text-align: center; vertical-align: middle;">${cellContent}</td>`;
      }
      tableHtml += `</tr>`;
    });

    tableHtml += `</tbody></table>`;
    container.innerHTML = tableHtml;

  } catch (err) {
    container.innerHTML = `<p style="color: #ef4444; text-align: center; font-size: 13px; padding: 20px;">載入失敗：${err.message}</p>`;
  }
}
window.loadSplitBoardData = loadSplitBoardData;

// 1. 當團務選擇改變時：只抓取分類包含「拆團款」的商品，並填入分類下拉選單
async function onGroupSelectChanged() {
  const groupSelect = document.getElementById('splitGroupSelect');
  const catSelect = document.getElementById('splitCategorySelect');
  const container = document.getElementById('splitBoardTableContainer');
  const statsContainer = document.getElementById('splitSummaryStats');

  if (!groupSelect || !catSelect) return;
  const selectedGroup = groupSelect.value;

  if (container) container.innerHTML = `<p style="color: #888; text-align: center; font-size: 13px;">請選擇商品分類。</p>`;
  if (statsContainer) statsContainer.innerHTML = "";
  catSelect.innerHTML = `<option value="">-- 請選擇商品分類 --</option>`;

  if (!selectedGroup) return;

  try {
   const { data, error } = await db.from('products').select('*')
  .eq('團務名稱', selectedGroup);
if (error) throw error;

let categoriesSet = new Set();
(data || []).forEach(p => {  // ✔️ 改成正確的 data
  
      // 💡 強制確保抓出來的團務名稱跟分類轉成乾淨的字串來比對
      let dbGroupName = String(p['團務名稱'] || '').trim();
      let targetGroup = String(selectedGroup || '').trim();
      
      // 如果這筆商品的團務名稱跟目前選的不一樣，直接跳過
      if (dbGroupName !== targetGroup) return;

      let pCat = String(p['商品分類'] || '').trim();
      let pName = String(p['商品名稱'] || '').trim();

      // 嚴格排除抱盒款，且分類必須包含「拆團款」
      if (pCat.includes('抱盒款') || pName.includes('[抱盒款]')) return;

      if (pCat.includes('拆團款')) {
        categoriesSet.add(pCat);
      }
    });

    let html = `<option value="">-- 請選擇商品分類 --</option>`;
    categoriesSet.forEach(cat => {
      html += `<option value="${cat}">${cat}</option>`;
    });

    if (categoriesSet.size === 0) {
      html = `<option value="">-- 此團務沒有拆團分類 --</option>`;
    }

    catSelect.innerHTML = html;
  } catch (err) {
    console.error("載入分類失敗：", err);
    catSelect.innerHTML = `<option value="">載入分類失敗</option>`;
  }
}
window.onGroupSelectChanged = onGroupSelectChanged;
    
  </script>
