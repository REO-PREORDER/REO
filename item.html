        // 自動抓取目前的 id 參數，並無縫跳轉回首頁帶入該 id
        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');
        if (itemId) {
            window.location.replace(`/?id=${itemId}`);
        } else {
            window.location.replace('/');
        }
